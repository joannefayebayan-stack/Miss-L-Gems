<div class="eye">Year 11 · Maths English</div><h1>Maths Word Lab November 4, 2026</h1><p class="sub">Six stages · learn it, see it, use it, spell it</p>
<div class="card" id="g"></div><div id="ac" role="alertdialog" aria-live="assertive"></div></div>
<script>
// term, Chinese, simple definition, gap sentence, group (c=circle, a=algebra)
const W=[
["tangent","切线","a straight line that touches a circle at exactly one point","A ___ touches the circle at only one point.","c"],
["diameter","直径","a line through the centre from one side of the circle to the other","The ___ goes through the centre of the circle.","c"],
["radius","半径","a line from the centre of the circle to the edge","The ___ is half of the diameter.","c"],
["chord","弦","a line from one side of a circle to the other that does NOT go through the centre","A ___ joins two points on a circle but misses the centre.","c"],
["circumference","圆周","the distance around the outside of a circle","The ___ is the perimeter of a circle.","c"],
["arc","弧","a part of the circumference of a circle","An ___ is a part of the circumference.","c"],
["segment","弓形","a part of a circle cut off by a chord","A ___ is made when a chord cuts a circle.","c"],
["vertex","顶点","a point where two lines meet and make an angle","The angle is made at the ___.","c"],
["subtended","所对的","when lines from a point to the two ends of an arc make an angle","Angle ABC is ___ by arc AC.","c"],
["polygon","多边形","any closed 2D shape with straight sides","A triangle is a ___ because it is a closed shape with straight sides.","c"],
["quadrilateral","四边形","any shape with 4 sides","A square is a ___ because it has 4 sides.","c"],
["secant","割线","a line that cuts through a circle at two points","A ___ crosses the circle at two points.","c"],
["simplify","化简","make an expression shorter and easier","To ___ 2x + 3x, write 5x.","a"],
["evaluate","求值","find the value by putting numbers in","To ___ 3x + 1 when x = 2, put 2 in place of x.","a"],
["solve","求解","find the value of the unknown letter","___ 2x + 3 = 11 to find x.","a"],
["factorise","因式分解","write as a product using brackets","To ___ x² + 5x, write x(x + 5).","a"],
["expand","展开","multiply out the brackets","To ___ 3(x + 2), multiply to get 3x + 6.","a"],
["equivalent","等价的","having the same value","2/4 and 1/2 are ___ fractions.","a"],
["reciprocal","倒数","1 divided by the number (flip the fraction)","The ___ of 3/4 is 4/3.","a"]];
const CMD=[["solve","Find x:  2x + 3 = 11"],["expand","3(x + 2) → 3x + 6"],["factorise","x² + 5x → x(x + 5)"],["evaluate","Work out 3x + 1 when x = 2"],["simplify","4x + 2x → 6x"],["reciprocal","3/4 → 4/3"],["equivalent","2/4 and 1/2 have the same value. They are ___ fractions."]];
const NAMES=["1 · See it","2 · Meaning","3 · Command words","4 · Fill the gap","5 · Spell it","6 · Teach-back"];
const $=id=>document.getElementById(id),g=$("g"),sh=a=>[...a].sort(()=>Math.random()-.5),T=t=>W.find(w=>w[0]==t);
let S,M={},stg=[];
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const opts=w=>sh([w[0],...sh(W.filter(x=>x[4]==w[4]&&x[0]!=w[0])).slice(0,3).map(x=>x[0])]);
const zt=w=>S.zh?` <span class="zh">${T(w)[1]}</span>`:"";
function intro(){AT=false;S={name:"",zh:false,score:0,streak:0,st:0,q:[],i:0,sok:0,sn:0,ok:0,n:0,txt:[]};M={};stg=[];
g.innerHTML=`<div class="box"><b>Learning Goal</b><br>Build and use 19 key Year 11 maths words (circles and algebra) so you can read, follow and explain maths in English.</div>
<div class="box"><b>Learning Objectives</b> By the end I can:<ul><li>match circle words to the right part of a diagram,</li><li>choose the correct command word (solve, expand, factorise…) for an exam task,</li><li>spell the long words correctly,</li><li>write 3 accurate sentences that explain maths words.</li></ul></div>
<div class="box"><b>Framework Alignment</b><br>WIDA level: 3 (Developing) · Domains: Reading, Writing · Key Use: Explain · IELTS: not targeted (maths vocabulary).<br><small>Informed by WIDA descriptors; not an official WIDA-aligned product.</small></div>
<div class="box">💡 Words with a <span class="gw" data-z="点状下划线">dotted underline</span> are helper words. Tap one to see its Chinese meaning and hear it.</div>
<div class="box"><b>Success Criteria</b> ≥ 80% on stages 1–5 and 3 clear sentences in stage 6. Words you miss come back again!</div>
<div class="box"><b>🔒 Before you start</b><ul><li>Do this activity <b>on your own</b>.</li><li>Stay on this page. If you switch tab or window, you get a warning.</li><li>If you leave a second time, your attempt <b>restarts from the beginning</b>.</li><li>Copy, paste and right-click are turned off.</li></ul><label><input type="checkbox" id="okc"> I understand and I will work on my own.</label></div>
<label><b>Your name</b></label><input type="text" id="nm" placeholder="Mark" style="margin:6px 0 12px">
<label style="font-size:14px"><input type="checkbox" id="zh"> Show 中文 hints (try to switch it off later!)</label><br><br><button class="btn o" id="go">Start the lab</button>`;
$("go").onclick=()=>{if(!$("okc").checked){modal("Please tick the box to say you will work on your own.");return}S.name=$("nm").value.trim()||"Student";S.zh=$("zh").checked;AT=true;ST=0;AW=false;begin(0)}}
function begin(n){S.st=n;S.i=0;S.sok=0;S.sn=0;
const long=W.filter(w=>w[0].length>=7).map(w=>w[0]);
S.q=n==0?[...sh(["chord","diameter","radius","tangent","secant","arc"]).map(id=>({t:"dia",w:id})),...sh(["segment","polygon","quadrilateral","subtended","vertex","circumference","chord","tangent"]).map(w=>({t:"pm",w}))]:
n==1?sh(W).slice(0,10).map(w=>({t:"mc",w:w[0],p:`Which word means: “${w[2]}”?`})):
n==2?sh(CMD).map(c=>({t:"mc",w:c[0],cmd:1,p:`The question says: <b>${c[1]}</b><br>Which maths word fits?`})):
n==3?sh(W).slice(0,10).map(w=>({t:"mc",w:w[0],p:w[3].replace("___","<b>_____</b>")})):
n==4?sh(long).slice(0,8).map(w=>({t:"sp",w})):[{t:"teach"}];
show()}
function head(){return`<div class="dots">${NAMES.map((_,i)=>`<span class="${i<S.st?"c":i==S.st?"d":""}"></span>`).join("")}</div><div class="sr"><span>${NAMES[S.st]} · ${Math.min(S.i+1,S.q.length)}/${S.q.length}</span><span>⭐ ${S.score} · 🔥 ${S.streak}</span></div><div class="pg"><i style="width:${S.i/S.q.length*100}%"></i></div>`}
function rec(ok,it){const m=M[it.w]=M[it.w]||{ok:0,bad:0};ok?m.ok++:m.bad++;
if(ok){S.streak++;S.score+=10+(S.streak>=3?5:0)}else{S.streak=0;if(!it.r)S.q.push({...it,r:1})}
if(!it.r){S.sn++;S.n++;if(ok){S.sok++;S.ok++}}}
function burst(){for(let i=0;i<10;i++){const s=document.createElement("span");s.className="bit";s.textContent=["⭐","✨","🎉"][i%3];s.style.setProperty("--x",(Math.random()*320-160)+"px");s.style.setProperty("--y",(-Math.random()*220-40)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
function fb(ok,msg){if(ok)burst();const f=$("fb");f.innerHTML=`<b class="${ok?"g":"r"}">${ok?"Correct! "+(S.streak>=3?"🔥 ":""):"Not yet. "}</b>${msg}`;$("nx").style.display="inline-block"}
function nextBtn(){return`<div class="row"><button class="btn s" id="sp">🔊 Hear it</button><button class="btn" id="nx" style="display:none">Next →</button></div><div class="fb" id="fb"></div><label style="font-size:13px;color:var(--mu)"><input type="checkbox" id="zt" ${S.zh?"checked":""}> 中文 hints</label>`}
function wire(w){$("nx").onclick=()=>{S.i++;show()};$("sp").onclick=()=>say(w);$("zt").onchange=e=>{S.zh=e.target.checked;show(true)}}
function show(keep){if(S.i>=S.q.length)return endStage();const it=S.q[S.i];
if(it.t=="mc"){const o=opts(T(it.w));
g.innerHTML=head()+`<p class="q">${it.p}</p><div class="opts" id="o"></div>`+nextBtn();
o.forEach(x=>{const b=document.createElement("button");b.className="opt";b.innerHTML=x+zt(x);b.onclick=()=>{if(b.disabled)return;const ok=x==it.w;
document.querySelectorAll(".opt").forEach(e=>{e.disabled=1;if(e.textContent.startsWith(it.w))e.classList.add("ok")});if(!ok)b.classList.add("no");
rec(ok,it);const w=T(it.w);fb(ok,`<b>${w[0]}</b> = ${w[2]}.${PIC[w[0]]?pic(w[0]):""}`);say(w[0])};$("o").appendChild(b)});wire(it.w)}
else if(it.t=="dia")dia(it);else if(it.t=="pm")pm(it);
else if(it.t=="sp"){const w=T(it.w);
g.innerHTML=head()+`<p class="q">Spell the word:<br><span style="font-weight:400">${w[2]}</span>${zt(it.w)}</p>${PIC[it.w]?pic(it.w):""}<p>Starts with <b>${w[0][0]}</b> · ${w[0].length} letters</p><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row"><button class="btn" id="ck">Check</button></div>`+nextBtn();
$("in").focus();$("ck").onclick=()=>{if($("in").disabled)return;const v=$("in").value.trim().toLowerCase();const ok=v==it.w||(it.w=="factorise"&&v=="factorize");$("in").disabled=1;rec(ok,it);fb(ok,`Correct spelling: <b>${it.w}</b>`);say(it.w)};
$("in").onkeydown=e=>{if(e.key=="Enter")$("ck").click()};wire(it.w);$("sp").onclick=()=>say(it.w)}
else teach()}
function pm(it){const o=sh([it.w,...sh(Object.keys(PIC).filter(k=>k!=it.w)).slice(0,3)]);
g.innerHTML=head()+`<p class="q">Which picture shows a <span style="color:var(--td)">${it.w}</span>?${zt(it.w)}</p><div class="pgrid" id="o"></div>`+nextBtn();
o.forEach(k=>{const b=document.createElement("button");b.className="opt pb";b.dataset.k=k;b.innerHTML=pic(k);b.onclick=()=>{if(b.disabled)return;const ok=k==it.w;
document.querySelectorAll(".pb").forEach(e=>{e.disabled=1;if(e.dataset.k==it.w)e.classList.add("ok")});if(!ok)b.classList.add("no");
rec(ok,it);fb(ok,`<b>${it.w}</b> = ${T(it.w)[2]}.`);say(it.w)};$("o").appendChild(b)});wire(it.w)}
function dia(it){const P=a=>[150+100*Math.cos(a*Math.PI/180),150-100*Math.sin(a*Math.PI/180)].map(v=>+v.toFixed(1));
const A=P(195),B=P(225),e1=[A[0]+(A[0]-B[0])*.8,A[1]+(A[1]-B[1])*.8],e2=[B[0]+(B[0]-A[0])*.8,B[1]+(B[1]-A[1])*.8];
const ln=(a,b)=>`M${a[0]} ${a[1]}L${b[0]} ${b[1]}`;const a1=P(275),a2=P(315);
const D={chord:[ln(P(20),P(70)),"#3B5BDB"],diameter:[ln(P(150),P(330)),"#C026D3"],radius:[ln([150,150],P(250)),"#06B6D4"],tangent:[ln([80,50],[220,50]),"#DC2626"],secant:[ln(e1,e2),"#16A34A"],arc:[`M${a1[0]} ${a1[1]}A100 100 0 0 0 ${a2[0]} ${a2[1]}`,"#E08E45"]};
g.innerHTML=head()+`<p class="q">Tap the <span style="color:var(--td)">${it.w}</span>${zt(it.w)}</p><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="100" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="150" cy="150" r="4"/>${Object.entries(D).map(([k,v])=>`<path id="v${k}" d="${v[0]}" stroke="${v[1]}" stroke-width="${k=="arc"?7:4}" fill="none" stroke-linecap="round"/><path class="hit" data-k="${k}" d="${v[0]}"/>`).join("")}</svg>`+nextBtn();
document.querySelectorAll(".hit").forEach(h=>h.onclick=()=>{if($("nx").style.display=="inline-block")return;const k=h.dataset.k,ok=k==it.w;
$("v"+it.w).setAttribute("stroke","#1F7A3D");$("v"+it.w).setAttribute("stroke-width",8);if(!ok)$("v"+k).setAttribute("stroke","#B23B32");
rec(ok,it);fb(ok,`<b>${it.w}</b> = ${T(it.w)[2]}.`);say(it.w)});wire(it.w)}
function endStage(){const a=S.sn?Math.round(100*S.sok/S.sn):100,st=a>=90?3:a>=70?2:1;stg.push(a);
g.innerHTML=`<div class="big">${"⭐".repeat(st)}</div><h2 style="text-align:center;margin:6px 0">Stage ${S.st+1} done!</h2><p style="text-align:center;color:var(--mu)">First-try accuracy: <b>${a}%</b> · Missed words came back for a second try.</p><button class="btn o" id="n">${S.st==3?"Next: spelling":S.st==4?"Last stage: write it":"Next stage"} →</button>`;$("n").onclick=()=>begin(S.st+1)}
function teach(){const F=["A chord is different from a diameter because …","To solve an equation, I …","Choose two words (simplify, expand, factorise) and explain the difference: …"];
g.innerHTML=head()+`<p class="q">Teach-back: explain in your own words</p><div class="box">Write 1–2 full sentences each. Use the words in <b>bold</b>.</div>`+F.map((f,i)=>`<label><b>${i+1}.</b> ${f}</label><textarea id="t${i}"></textarea>`).join("")+`<button class="btn o" id="fin">Finish</button>`;
$("fin").onclick=()=>{S.txt=F.map((f,i)=>f+"\n"+$("t"+i).value.trim());finish()}}
function finish(){AT=false;const acc=S.n?Math.round(100*S.ok/S.n):0;const miss=Object.keys(M).filter(k=>M[k].bad>0);
const L=[["Matched circle words to the diagram (80%+)",stg[0]>=80],["Chose the right command word (80%+)",stg[2]>=80],["Knew meanings and used words in gaps (80%+)",stg[1]>=80&&stg[3]>=80],["Spelled the long words (80%+)",stg[4]>=80],["Wrote 3 explanation sentences (teacher checks accuracy)",S.txt.filter(x=>(x.split("\n")[1]||"").split(/\s+/).filter(Boolean).length>=6).length==3]];
const chk=L.map(l=>(l[1]?"✅ ":"🔁 ")+l[0]).join("<br>");
const sum=`Maths Word Lab — ${S.name}\nAccuracy: ${acc}% | Score: ${S.score}\nStages 1–5: ${stg.join("%, ")}%\nWords to review: ${miss.join(", ")||"none"}\n\n${S.txt.join("\n\n")}`;
g.innerHTML=`<div class="big">${acc>=90?"🏆":acc>=75?"🌟":"💪"}</div><h2 style="text-align:center;margin:6px 0">${S.name}, you finished!</h2><div class="stat"><div><b>${S.score}</b>Score</div><div><b>${acc}%</b>First-try</div><div><b>${miss.length}</b>To review</div></div>
<p><b>Did I reach my goals?</b></p><div class="box">${chk}</div><p><b>Your words</b></p><div class="chips">${W.map(w=>`<span class="chip ${M[w[0]]&&M[w[0]].bad?"b":"g"}">${w[0]}</span>`).join("")}</div><p style="font-size:13px;color:var(--mu)">Red = practise again. Play again to turn them green!</p><p><b>Picture dictionary</b></p><div class="gal">${Object.keys(PIC).map(k=>`<figure>${pic(k)}${k}</figure>`).join("")}</div>
<div class="row"><button class="btn" id="cp">Copy results for my teacher</button><button class="btn s" id="ag">Play again</button></div><p class="fb" id="ct"></p>`;
