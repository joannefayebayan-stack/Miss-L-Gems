<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Survey Showdown</title>
<style>
/* Layout: one shared classroom screen. Two team scores on top, the answer board in the middle, teacher buttons below. Single light look, matching the site's pastel EAL pages. */
:root{color-scheme:light;--bg:#F7FCFA;--card:#FFFFFF;--ink:#2F3A4A;--mut:#5F6B7A;--line:#D5EBE1;--mint:#BFE6D6;--mint2:#9FD3BE;--mintl:#E4F5EE;--deep:#1F4D40;--peach:#FBE2CC;--peach2:#F5C49A;--peachd:#7A4E1E;--bad:#A63A32;--badb:#FCEBE8;--ok:#1F6B45;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--th:"Noto Sans Thai","Thonburi","Leelawadee UI",sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;padding-block:clamp(10px,2vh,22px) 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:1080px;margin:0 auto;display:grid;gap:10px}
.wrap.narrow{max-width:720px}
header{text-align:center}
.eye{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--deep)}
h1{font-size:clamp(28px,4vw,40px);margin:4px 0;color:var(--deep);text-wrap:balance}
h2{font-size:20px;margin:0 0 6px;color:var(--deep)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.box{background:var(--mintl);border-radius:12px;padding:10px 14px}
.box b{color:var(--deep)}
.box ul{margin:4px 0 0;padding-left:20px}
label{font-weight:700;display:block;margin-bottom:4px}
input,select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;background:var(--mint);color:var(--deep);box-shadow:0 3px 0 var(--mint2)}
.btn:hover{background:var(--mint2)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.line{background:#fff;border:1.5px solid var(--mint2);box-shadow:0 3px 0 var(--line)}
.btn.line:hover{background:var(--mintl)}
.btn.wide{width:100%;font-size:18px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.c{justify-content:center}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.team{border-radius:16px;padding:6px 12px;border:3px solid transparent;display:grid;gap:2px;text-align:center;min-width:0}
.team.a{background:var(--mintl);color:var(--deep)}
.team.b{background:var(--peach);color:var(--peachd)}
.team.on.a{border-color:var(--deep)}
.team.on.b{border-color:var(--peachd)}
.team .nm{font-weight:700;font-size:clamp(15px,2vw,20px);overflow-wrap:anywhere}
.team .sc{font-size:clamp(36px,5vw,50px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.team .st{font-size:13px;font-weight:700}
.fix{display:flex;justify-content:center;gap:6px;align-items:center}
.fix button{border:1px solid currentColor;background:transparent;border-radius:8px;padding:0 9px;font-size:13px;font-weight:700;min-height:26px}
.mid{display:grid;align-content:center;justify-items:center;text-align:center;min-width:88px;gap:2px}
.mid small{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.mid b{font-size:clamp(28px,4vw,42px);line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.q{font-size:clamp(23px,3.2vw,34px);font-weight:800;text-align:center;margin:0;color:var(--ink);text-wrap:balance}
.qn{text-align:center;color:var(--mut);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.help{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;text-align:center}
.help .box{font-size:clamp(15px,1.8vw,18px);flex:1 1 280px;min-width:0;padding:6px 12px}
.help .tr span{display:block}
.board{display:grid;gap:7px}
.slot{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;min-height:clamp(46px,6.8vh,72px);padding:4px 14px;border:0;border-radius:14px;background:var(--mint);box-shadow:0 3px 0 var(--mint2);text-align:left;color:var(--deep)}
.slot:hover:not(:disabled){background:var(--mint2)}
.slot:disabled{cursor:default;opacity:.7}
.slot .n{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.slot .hid{font-size:15px;color:var(--deep);opacity:.7}
.slot.open{background:#fff;box-shadow:inset 0 0 0 2px var(--mint2)}
.slot.new{animation:flip .3s ease-out}
.slot.open:disabled{opacity:1}
.slot.late{background:#F2F5F4;box-shadow:inset 0 0 0 1px var(--line);color:var(--mut)}
.slot .an{font-size:clamp(20px,2.8vw,28px);font-weight:800;min-width:0;overflow-wrap:anywhere}
.slot .an u{text-decoration:underline dotted var(--peach2) 2px;text-underline-offset:5px}
.slot .tx{display:block;font-size:clamp(14px,1.8vw,17px);font-weight:600;color:var(--mut)}
.slot .pt{font-size:clamp(20px,2.8vw,28px);font-weight:800;font-variant-numeric:tabular-nums;background:var(--mintl);padding:2px 12px;border-radius:10px}
.slot.late .pt{background:none;font-size:14px;font-weight:600}
@keyframes flip{from{transform:rotateX(70deg)}to{transform:none}}
.say{text-align:center;font-size:clamp(16px,2.2vw,20px);font-weight:700;color:var(--deep);min-height:28px;margin:0}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.strikes{display:flex;gap:6px}
.strikes i{width:clamp(36px,5vw,50px);height:clamp(36px,5vw,50px);border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:clamp(22px,3.4vw,32px);background:#fff;border:2px dashed var(--line);color:transparent}
.strikes i.x{background:var(--badb);border:2px solid var(--bad);color:var(--bad)}
.mist{border:0;border-radius:14px;padding:14px 20px;font-size:clamp(18px,2.6vw,24px);font-weight:800;background:var(--badb);color:var(--bad);box-shadow:0 3px 0 #EBBDB6;width:100%}
.mist:hover:not(:disabled){background:#F8D8D3}
.mist:active{transform:translateY(2px);box-shadow:none}
.mist:disabled{opacity:.4;cursor:default;transform:none}
#bigx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;background:rgba(252,235,232,.55)}
#bigx span{font-size:min(55vh,55vw);line-height:1;font-weight:900;color:var(--bad);animation:pop .75s ease-out both}
@keyframes pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{background:var(--mintl);color:var(--deep);text-align:left;padding:8px 10px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.win{text-align:center;font-size:clamp(28px,5vw,46px);font-weight:800;color:var(--deep);margin:0;text-wrap:balance}
.note{font-size:14px;color:var(--mut)}
.msg{font-size:14px;color:var(--ok);min-height:20px;margin:0}
.kq{padding:10px 0;border-top:1px solid var(--line)}
.kq ol{margin:4px 0 0;padding-left:24px}
.kq small{color:var(--mut)}
.kq.big{border:0;padding:4px 0 0;font-size:20px}.kq.big b{color:var(--deep)}.kq.big li{margin:6px 0}.kq.big li b{color:var(--ink);font-size:24px}.kq.big small{display:block;font-size:16px}
.ab{background:#EEEAF8;color:#463A73;border-radius:14px;padding:8px 14px;text-align:center;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;align-items:baseline}
.ab small{font-weight:600;color:#5E5590}
.topic{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.topic button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;color:var(--ink)}
.topic button small{display:block;font-weight:500;color:var(--mut);font-size:14px}
.topic button[aria-pressed="true"]{border-color:var(--deep);background:var(--mintl);color:var(--deep)}
.topic button.abt[aria-pressed="true"]{border-color:#463A73;background:#EEEAF8;color:#463A73}
.tell{display:grid;gap:10px}
.tell .lead{background:#EEEAF8;color:#463A73;border-radius:16px;padding:16px;text-align:center}
.tell .lead b{display:block;font-size:clamp(22px,3.2vw,30px)}
.tell .tr{display:block;font-size:15px;font-weight:500;color:var(--mut)}
.tell .lead .tr{color:#5E5590}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.people li{background:var(--mintl);border-radius:12px;padding:10px 14px;font-weight:700;color:var(--deep)}
@media (max-width:560px){.teams{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;grid-row:1;display:flex;gap:8px;align-items:baseline;justify-content:center}.ctl{grid-template-columns:1fr}.strikes{justify-content:center}.slot{grid-template-columns:40px 1fr auto;gap:8px}.slot .n{width:32px;height:32px;font-size:16px}}
@media (prefers-reduced-motion:reduce){.slot.new{animation:none}#bigx span{animation-duration:.01s;animation-delay:.7s;animation-fill-mode:backwards;opacity:1}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
/* Questions. Answers are in slot order, highest points first. Each question's points add up to 100.
   [answer, points, Thai, Chinese, also accept] */
const QS=[
{t:"Name something in a kitchen.",th:"บอกชื่อสิ่งของที่อยู่ในครัว",zh:"说出厨房里的一样东西。",f:"There is a ___ in the kitchen.",a:[["fridge",35,"ตู้เย็น","冰箱","refrigerator"],["stove",25,"เตา","炉子","cooker, oven"],["table",15,"โต๊ะ","桌子",""],["sink",15,"อ่างล้างจาน","水槽",""],["spoon",10,"ช้อน","勺子","fork, knife, plate"]]},
{t:"Name something in your school bag.",th:"บอกชื่อสิ่งของที่อยู่ในกระเป๋านักเรียนของคุณ",zh:"说出你书包里的一样东西。",f:"I have a ___ in my school bag.",a:[["book",35,"หนังสือ","书","notebook"],["pen",25,"ปากกา","笔",""],["laptop",20,"แล็ปท็อป","笔记本电脑","computer, iPad"],["water bottle",12,"ขวดน้ำ","水瓶","bottle"],["pencil",8,"ดินสอ","铅笔",""]]},
{t:"Name a food people eat for breakfast.",th:"บอกชื่ออาหารที่คนกินตอนเช้า",zh:"说出人们早餐吃的一种食物。",f:"People eat ___ for breakfast.",a:[["rice",30,"ข้าว","米饭","rice soup"],["eggs",25,"ไข่","鸡蛋",""],["bread",20,"ขนมปัง","面包","toast"],["fruit",15,"ผลไม้","水果",""],["noodles",10,"ก๋วยเตี๋ยว","面条",""]]},
{t:"Name a way to go to school.",th:"บอกวิธีเดินทางไปโรงเรียน",zh:"说出一种去学校的方式。",f:"I go to school by ___.",a:[["car",35,"รถยนต์","汽车",""],["bus",30,"รถบัส","公交车","school bus"],["motorbike",15,"มอเตอร์ไซค์","摩托车",""],["walking",12,"เดิน","走路","on foot"],["train",8,"รถไฟ","火车","BTS, MRT"]]},
{t:"Name something you use on a rainy day.",th:"บอกชื่อสิ่งที่คุณใช้เมื่อฝนตก",zh:"说出下雨天你会用的一样东西。",f:"I use a ___ when it rains.",a:[["umbrella",50,"ร่ม","雨伞",""],["raincoat",25,"เสื้อกันฝน","雨衣","jacket"],["boots",12,"รองเท้าบูท","靴子",""],["taxi",8,"แท็กซี่","出租车","car"],["hat",5,"หมวก","帽子",""]]},
{t:"Name a pet.",th:"บอกชื่อสัตว์เลี้ยง",zh:"说出一种宠物。",f:"Many people have a ___ as a pet.",a:[["dog",40,"สุนัข","狗",""],["cat",35,"แมว","猫",""],["fish",12,"ปลา","鱼",""],["bird",8,"นก","鸟",""],["rabbit",5,"กระต่าย","兔子",""]]},
{t:"Name a job in a hospital.",th:"บอกชื่องานในโรงพยาบาล",zh:"说出医院里的一种工作。",f:"A ___ works in a hospital.",a:[["doctor",45,"หมอ","医生",""],["nurse",35,"พยาบาล","护士",""],["cleaner",10,"พนักงานทำความสะอาด","清洁工",""],["cook",5,"พ่อครัว","厨师","chef"],["driver",5,"คนขับรถ","司机","ambulance driver"]]},
{t:"Name a school subject.",th:"บอกชื่อวิชาเรียน",zh:"说出一门学校科目。",f:"We study ___ at school.",a:[["Maths",30,"คณิตศาสตร์","数学",""],["English",25,"ภาษาอังกฤษ","英语",""],["Science",20,"วิทยาศาสตร์","科学",""],["Art",15,"ศิลปะ","美术",""],["PE",10,"พลศึกษา","体育","sport"]]},
{t:"Name something you do after school.",th:"บอกสิ่งที่คุณทำหลังเลิกเรียน",zh:"说出你放学后做的一件事。",f:"After school, I ___.",a:[["do homework",30,"ทำการบ้าน","做作业","study"],["play games",25,"เล่นเกม","玩游戏",""],["sleep",20,"นอนหลับ","睡觉",""],["eat",15,"กินอาหาร","吃东西","have dinner"],["play sports",10,"เล่นกีฬา","做运动","go to the gym"]]},
{t:"Name a sport with a ball.",th:"บอกชื่อกีฬาที่ใช้ลูกบอล",zh:"说出一种用球的运动。",f:"People use a ball in ___.",a:[["football",40,"ฟุตบอล","足球","soccer"],["basketball",30,"บาสเกตบอล","篮球",""],["volleyball",15,"วอลเลย์บอล","排球",""],["tennis",10,"เทนนิส","网球",""],["golf",5,"กอล์ฟ","高尔夫球",""]]},
{t:"Name something you do on your phone.",th:"บอกสิ่งที่คุณทำบนโทรศัพท์",zh:"说出你用手机做的一件事。",f:"I ___ on my phone.",a:[["send messages",30,"ส่งข้อความ","发信息","chat, text"],["watch videos",30,"ดูวิดีโอ","看视频","watch TikTok, YouTube"],["play games",20,"เล่นเกม","玩游戏",""],["take photos",12,"ถ่ายรูป","拍照",""],["listen to music",8,"ฟังเพลง","听音乐",""]]},
{t:"Name something you take to the beach.",th:"บอกชื่อสิ่งที่คุณนำไปชายหาด",zh:"说出你带去海滩的一样东西。",f:"I take ___ to the beach.",a:[["towel",30,"ผ้าเช็ดตัว","毛巾",""],["sunscreen",25,"ครีมกันแดด","防晒霜","sun cream"],["swimsuit",20,"ชุดว่ายน้ำ","泳衣","swimming clothes"],["hat",15,"หมวก","帽子","sunglasses"],["water",10,"น้ำ","水","drink"]]},
{t:"Name a cold drink.",th:"บอกชื่อเครื่องดื่มเย็น",zh:"说出一种冷饮。",f:"I like to drink cold ___.",a:[["water",35,"น้ำ","水",""],["juice",25,"น้ำผลไม้","果汁",""],["cola",20,"โคล่า","可乐","soda, soft drink"],["iced tea",12,"ชาเย็น","冰茶","Thai tea"],["milk",8,"นม","牛奶",""]]},
{t:"Name a sweet fruit.",th:"บอกชื่อผลไม้รสหวาน",zh:"说出一种甜的水果。",f:"A ___ is a sweet fruit.",a:[["mango",35,"มะม่วง","芒果",""],["banana",25,"กล้วย","香蕉",""],["watermelon",20,"แตงโม","西瓜",""],["apple",12,"แอปเปิล","苹果",""],["orange",8,"ส้ม","橙子",""]]},
{t:"Name something in a classroom.",th:"บอกชื่อสิ่งของที่อยู่ในห้องเรียน",zh:"说出教室里的一样东西。",f:"There is a ___ in our classroom.",a:[["desk",30,"โต๊ะเรียน","课桌","table"],["chair",25,"เก้าอี้","椅子",""],["whiteboard",25,"ไวท์บอร์ด","白板","board"],["clock",12,"นาฬิกา","时钟",""],["computer",8,"คอมพิวเตอร์","电脑","projector, TV"]]},
{t:"Name something you do before school.",th:"บอกสิ่งที่คุณทำก่อนไปโรงเรียน",zh:"说出你上学前做的一件事。",f:"Before school, I ___.",a:[["brush my teeth",30,"แปรงฟัน","刷牙",""],["take a shower",25,"อาบน้ำ","洗澡","wash"],["eat breakfast",25,"กินอาหารเช้า","吃早餐",""],["get dressed",12,"แต่งตัว","穿衣服","put on my uniform"],["pack my bag",8,"จัดกระเป๋า","整理书包",""]]},
{t:"Name something you do on a very hot day.",th:"บอกสิ่งที่คุณทำในวันที่ร้อนมาก",zh:"说出很热的时候你做的一件事。",f:"On a very hot day, I ___.",a:[["drink water",30,"ดื่มน้ำ","喝水",""],["go swimming",25,"ไปว่ายน้ำ","去游泳",""],["turn on the air conditioner",25,"เปิดแอร์","开空调","turn on the AC, fan"],["eat ice cream",12,"กินไอศกรีม","吃冰淇淋",""],["stay inside",8,"อยู่ในบ้าน","待在室内","stay at home"]]},
{t:"Name something you wear to school.",th:"บอกชื่อสิ่งที่คุณใส่ไปโรงเรียน",zh:"说出你穿去学校的一样东西。",f:"I wear ___ to school.",a:[["a shirt",30,"เสื้อเชิ้ต","衬衫","uniform"],["shoes",25,"รองเท้า","鞋子",""],["trousers",20,"กางเกงขายาว","长裤","pants"],["socks",15,"ถุงเท้า","袜子",""],["a skirt",10,"กระโปรง","裙子",""]]},
{t:"Name a place where you can buy food.",th:"บอกชื่อสถานที่ที่คุณซื้ออาหารได้",zh:"说出一个可以买食物的地方。",f:"I can buy food at a ___.",a:[["supermarket",35,"ซูเปอร์มาร์เก็ต","超市",""],["restaurant",25,"ร้านอาหาร","餐厅","food stall"],["market",20,"ตลาด","市场",""],["convenience store",15,"ร้านสะดวกซื้อ","便利店","7-Eleven"],["canteen",5,"โรงอาหาร","食堂",""]]},
{t:"Name a place in a town.",th:"บอกชื่อสถานที่ในเมือง",zh:"说出城镇里的一个地方。",f:"There is a ___ in my town.",a:[["shopping mall",30,"ห้างสรรพสินค้า","商场","mall"],["school",25,"โรงเรียน","学校",""],["hospital",20,"โรงพยาบาล","医院",""],["park",15,"สวนสาธารณะ","公园",""],["bank",10,"ธนาคาร","银行",""]]}
];
/* Anti-Bullying Week questions (theme: Break the Silence). Same layout as QS above. The points are made up for the game. */

const SETS={everyday:{name:"Everyday life",qs:QS,rounds:[3,5,8,10,20],

 ab:{name:"Anti-Bullying Week: Break the Silence",qs:AB,rounds:[3,5,8,10,15],

const KEY="surveyShowdownGame";
const $=id=>document.getElementById(id),app=$("app");
const E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
let G=null,U=[],pick="everyday",view="start",keyFrom="start",msg="",justShown=-1;
function store(){if(!G)return;try{if(G.phase!=="end")localStorage.setItem(KEY,JSON.stringify(G));else localStorage.removeItem(KEY)}catch(e){}}
function saved(){try{const g=JSON.parse(localStorage.getItem(KEY));return g&&g.teams?g:null}catch(e){return null}}
function fresh(names,n,set){return{set:set,teams:names.map(x=>({name:x,score:0,correct:0,mistakes:0,steals:0,adj:0})),order:shuf(SETS[set].qs.map((_,k)=>k)).slice(0,n),r:0,hist:[],sup:{tq:[0,0,0],fr:[0,0,0],ta:[0,0,0]},...roundState()}}
function roundState(){return{phase:"face",ctl:null,strikes:0,bank:0,shown:[0,0,0,0,0],late:[0,0,0,0,0],tr:[0,0,0,0,0],tq:false,fr:false,found:0,mist:0,say:""}}
const Q=()=>SETS[setOf(G)].qs[G.order[G.r]];
const QN=()=>G.order[G.r]+1;
const snap=()=>{U.push(JSON.stringify(G));if(U.length>60)U.shift()};
const who=()=>G.phase==="play"?G.ctl:G.phase==="steal"?1-G.ctl:2;
function award(t,how){const q=Q(),bank=G.bank;if(t!==null)G.teams[t].score+=bank;
 const missed=q.a.filter((_,k)=>!G.shown[k]).map(a=>a[0]);
 G.hist.push({n:QN(),q:q.t,found:G.found,mist:G.mist,win:t,pts:t===null?0:bank,how:how,missed:missed});
 G.phase="done";
 G.say=how==="steal"?G.teams[t].name+" stole the round and won "+bank+" points!":how==="fail"?"The steal failed. "+G.teams[t].name+" keeps "+bank+" points.":G.teams[t].name+" found every answer and won "+bank+" points!"}
function reveal(k){const a=Q().a[k];if(G.phase==="face"){G.say="First choose which team answers first.";return render()}
 if(G.shown[k]){G.tr[k]=!G.tr[k];if(G.tr[k])G.sup.ta[who()]++;return render()}
 snap();justShown=k;
 if(G.phase==="done"){G.shown[k]=1;G.late[k]=1;return render()}
 G.shown[k]=1;G.found++;G.bank+=a[1];
 if(G.phase==="steal"){const t=1-G.ctl;G.teams[t].correct++;G.teams[t].steals++;award(t,"steal")}
 else{G.teams[G.ctl].correct++;G.say="Correct! +"+a[1]+" points.";if(G.shown.every(Boolean))award(G.ctl,"all")}
 render()}
function bigX(){const d=document.createElement("div");d.id="bigx";d.setAttribute("aria-hidden","true");d.innerHTML="<span>✕</span>";document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
function mistake(){if(G.phase==="play"){snap();G.strikes++;G.mist++;G.teams[G.ctl].mistakes++;
  if(G.strikes>=3){G.phase="steal";G.say=G.teams[G.ctl].name+" has 3 mistakes. "+G.teams[1-G.ctl].name+" can steal with one answer."}else G.say="Mistake "+G.strikes+" of 3. "+G.teams[G.ctl].name+", try again."}
 else if(G.phase==="steal"){snap();G.mist++;G.teams[1-G.ctl].mistakes++;award(G.ctl,"fail")}else return;
 bigX();render()}
function next(){snap();if(G.r+1>=G.order.length){G.phase="end";store();U=[];view="end";return render()}G.r++;Object.assign(G,roundState());render()}
function render(){store();({start:rStart,game:rGame,end:rEnd,key:rKey,tell:rTell})[view]()}
function head(set){return`<header><div class="eye">Years 10 &amp; 11 EAL · Speaking</div><h1>Survey Showdown</h1></header>`+(set==="ab"?banner():"")}
function banner(){return`<div class="ab">Anti-Bullying Week · Break the Silence <small>16–20 November 2026</small></div>`}
function goalHtml(set){const S=SETS[set];return`<div class="box"><b>Learning Goal</b><br>${E(S.goal)}</div>
 <div class="box"><b>Learning Objectives</b> By the end I can:<ul>${S.obj.map(o=>`<li>${E(o)}</li>`).join("")}</ul></div>
 <div class="box"><b>Success Criteria</b><ul><li>I answer in English.</li><li>I use a full sentence when I can.</li><li>I listen and do not repeat an answer on the board.</li></ul></div>`}
function roundOpts(set){return SETS[set].rounds.map(n=>`<option ${n===5?"selected":""}>${n}</option>`).join("")}
function rStart(){app.className="wrap narrow";const s=saved();
 app.innerHTML=head()+`<div id="ab">${pick==="ab"?banner():""}</div><div id="gl" style="display:grid;gap:10px">${goalHtml(pick)}</div>
 <div class="card" style="display:grid;gap:12px">
 ${s?`<div class="box"><b>You have a game in progress</b> (${E(SETS[setOf(s)].name)}). ${E(s.teams[0].name)} ${s.teams[0].score}, ${E(s.teams[1].name)} ${s.teams[1].score}. <button class="btn line" id="cont" style="margin-top:8px;display:block">Continue this game</button></div>`:""}
 <div><label id="tl">Topic</label><div class="topic" role="group" aria-labelledby="tl"><button data-set="everyday" aria-pressed="${pick==="everyday"}">Everyday life<small>Home, school, food and daily life · 20 questions</small></button><button class="abt" data-set="ab" aria-pressed="${pick==="ab"}">Anti-Bullying Week<small>Break the Silence · 15 questions</small></button></div></div>
 <div class="two"><div><label for="ta">Team 1 name</label><input id="ta" autocomplete="off" value="Team A" maxlength="24"></div><div><label for="tb">Team 2 name</label><input id="tb" autocomplete="off" value="Team B" maxlength="24"></div></div>
 <div><label for="rn">How many rounds?</label><select id="rn">${roundOpts(pick)}</select></div>
 <p class="note" style="margin:0">The points are made up for this game. They are not real survey results.</p>

 <button class="btn wide" id="go">Start the game</button>
 <button class="btn line" id="kb">Teacher answer key</button>
 </div>`;
 app.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{pick=b.dataset.set;app.querySelectorAll("[data-set]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("gl").innerHTML=goalHtml(pick);$("ab").innerHTML=pick==="ab"?banner():"";$("rn").innerHTML=roundOpts(pick)});
 $("go").onclick=()=>{const a=$("ta").value.trim(),b=$("tb").value.trim();if(!a||!b){$("er").textContent="Please type a name for both teams.";return}if(a.toLowerCase()===b.toLowerCase()){$("er").textContent="Please give the two teams different names.";return}G=fresh([a,b],+$("rn").value,pick);U=[];view="game";render()};
 $("kb").onclick=()=>{view="key";keyFrom="start";render()};if(s)$("cont").onclick=()=>{G=s;U=[];pick=setOf(s);view=G.phase==="end"?"end":"game";render()}}
function teamBox(k){const t=G.teams[k],on=(G.phase==="play"&&G.ctl===k)||(G.phase==="steal"&&G.ctl!==k),lb=G.phase==="steal"&&G.ctl!==k?"Stealing":G.phase==="play"&&G.ctl===k?"Answering":"";
 return`<div class="team ${k?"b":"a"} ${on?"on":""}"><div class="nm">${E(t.name)}</div><div class="sc" id="s${k}">${t.score}</div><div class="fix"><span class="st">${lb}</span><button data-fix="${k},-5" aria-label="Take 5 points from ${E(t.name)}">−5</button><button data-fix="${k},5" aria-label="Give 5 points to ${E(t.name)}">+5</button></div></div>`}
function rGame(){app.className="wrap";const q=Q(),P=G.phase;

 const lastR=G.r+1>=G.order.length;

 app.innerHTML=`${setOf(G)==="ab"?banner():""}<div class="teams">${teamBox(0)}<div class="mid"><small>Round points</small><b id="bank">${G.bank}</b><small>Round ${G.r+1} of ${G.order.length}</small><small>Question ${QN()}</small></div>${teamBox(1)}</div>
 <p class="q">${E(q.t)}</p>

 if($("btq"))$("btq").onclick=()=>{G.tq=true;G.sup.tq[who()]++;render()};

 if($("nx"))$("nx").onclick=next;
 $("mk").onclick=mistake;
