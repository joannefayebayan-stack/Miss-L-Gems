<script id="mlg-scaffold">
/* Miss L Gems: records which optional language supports a student chose to use. */
window.MLGScaffold=(function(){
var E=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var BOX='<div class="mlg-sc" style="border:1px solid #D9DEE7;border-radius:12px;padding:10px 12px;margin:10px 0;background:#fff;color:#2F3A4A;font-size:14px;line-height:1.45;text-align:left"><b>Language support I used</b>';
function make(defs){var u;function reset(){u={};defs.forEach(function(d){u[d[0]]={n:0,items:[]}})}reset();
function say(x){if(!x.n)return"Not used";var s=x.n==1?"Used once":"Used "+x.n+" times";if(x.items.length){var a=x.items.slice(0,12);s+=": "+a.join(", ")+(x.items.length>12?" and "+(x.items.length-12)+" more":"")}return s}
return{use:function(k,item){var x=u[k];if(!x)return;x.n++;if(item&&x.items.indexOf(item)<0)x.items.push(item)},once:function(k){var x=u[k];if(x&&!x.n)x.n=1},reset:reset,
rows:function(){return defs.map(function(d){return[d[1],say(u[d[0]])]})},
html:function(){return BOX+defs.map(function(d){return'<div>'+E(d[1])+': <b>'+E(say(u[d[0]]))+'</b></div>'}).join("")+'</div>'}}}
make.note=function(t){return BOX+'<div>'+E(t)+'</div></div>'};
return make})();
</script>
<script>
const MAP=[["📚","Library"],["🅿️","Car park"],["☕","Café"],["🏋️","Gym"],["🌳","Garden"],["🏦","Bank"],["🛍️","Shop"],["🚌","Bus stop"],["🏫","School"]];
const SEC=[["Map Reader 🗺️",0],["Time Travel ⏳",10],["Switch It 🔄",22],["Link Up 🔗",32],["Final Case ✅",42]];
// First answer in each list is the correct one (options are shuffled when shown).
const Q=[
["The garden is in the ___ of the map.",["middle","corner","top","bottom"]],
["The library is in the top ___ corner.",["left","right","middle","centre"]],
["The car park is ___ the library and the café.",["between","opposite","behind","under"]],
["The gym is ___ the bank.",["opposite","in front of","behind","inside"]],
["The bus stop is ___ the garden.",["south of","north of","east of","west of"]],
["The café is in the top ___ corner.",["right","left","middle","bottom"]],
["The school is in the bottom right-hand ___.",["corner","side","middle","edge"]],
["The bank is ___ the garden.",["next to","behind","between","inside"]],
["The shop is ___ the bus stop.",["west of","east of","north of","south of"]],
["The car park is ___ the garden.",["north of","south of","east of","west of"]],
["They ___ the old library last year.",["moved","move","moves","moving"]],
["The college ___ a new gym in 2010.",["built","builded","build","builds"]],
["Workers ___ many old trees.",["cut","cutted","cuts","cutting"]],
["The old café ___ a bookshop.",["became","becomed","become","becomes"]],
["They ___ a pond in the park.",["dug","digged","dig","digs"]],
["The city ___ the roads in 1998.",["expanded","expand","expands","expanding"]],
["Which verb is irregular?",["make","move","create","expand"]],
["Which verb is regular?",["develop","put","build","dig"]],
["In 1995 there ___ one car park.",["was","were","is","be"]],
["There ___ two cafés in 2005.",["were","was","are","be"]],
["The town ___ a lot between 2000 and 2020.",["changed","change","changes","changing"]],
["They ___ the bus stop to the left.",["put","putted","puts","puting"]],
["The gym ___ in 2010.",["was built","built","is built","were built"]],
["New trees ___ in the park.",["were planted","was planted","planted","are plant"]],
["The old library ___.",["was demolished","demolished","is demolish","were demolished"]],
["Two cafés ___ to the site.",["were added","was added","added","adds"]],
["Make it passive: They moved the bus stop.",["The bus stop was moved.","The bus stop moved.","The bus stop is moving.","They were moved."]],
["Which sentence is passive?",["A gym was built.","They built a gym.","A gym builds.","They are building a gym."]],
["Which sentence is active?",["The council expanded the park.","The park was expanded.","Trees were planted.","A pond was dug."]],
["A new road ___ last year.",["was constructed","constructed","were constructed","is construct"]],
["Two houses ___ to make space.",["were knocked down","was knocked down","knocked down","knock down"]],
["The passive is formed with:",["was / were + past participle","is + -ing","have + -ed","will + verb"]],
["The old gym was small. ___, the new gym is large.",["However","In addition","So","Because"]],
["A pool was built. ___, a café was added.",["In addition","However","Whereas","But"]],
["In 2005 there was a car park, ___ now there is a garden.",["whereas","so","also","then"]],
["___, the college grew and became more modern.",["Overall","Firstly","Because","Before"]],
["Which is the best introduction?",["The two maps show changes to a college between 2005 and today.","I think college is good.","Maps are boring.","Let me tell you about my town."]],
["Which word means 'knocked down'?",["demolished","built","moved","planted"]],
["Which word means 'got bigger'?",["expanded","shrank","removed","replaced"]],
["Which word means 'made'?",["created","destroyed","removed","closed"]],
["Which word means 'moved to a new place'?",["relocated","demolished","expanded","planted"]],
["The wasteland was ___ a park.",["transformed into","next to","opposite","between"]],
["The library is ___ the café and the gym.",["between","among","under","at"]],
["The pool is ___ the bottom left-hand corner.",["in","on","at","by"]],
["The car park is ___ the left of the gym.",["on","in","at","to"]],
["Which sentence is correct?",["The pond was dug last year.","The pond was dig last year.","The pond dug last year.","The pond is dug last year."]],
["Which sentence compares two maps?",["The new library is bigger than the old one.","The new library big.","The library is.","Library new old."]],
["Which sentence is an overview?",["Overall, the centre became larger.","The café has 20 tables.","A tree was planted by the door.","The toilet is green."]],
["A map report should have at least ___ words.",["150","50","100","300"]],
["You should spend about ___ minutes on a map report.",["20","5","40","60"]]];
const RULE=["Use north, south, east and west and words like corner and middle to say exactly where a place is.","Use the past simple for finished actions. Regular verbs add -ed. Irregular verbs change (build → built).","The passive is was / were + past participle. Use it when the action is more important than who did it.","Linking words show addition (In addition), contrast (However, whereas) and overview (Overall).","A good map report has an introduction, an overview, details and a final check. Aim for 150+ words in about 20 minutes."];
const ST0=[0,10,22,32,42,50],NAMES=SEC.map(s=>s[0]).concat(["Review round"]);
const CFG={resetAt:2,fsRequired:true}; // 2 = warn on 1st departure, reset on 2nd
const $=id=>document.getElementById(id),g=$("g");
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};
let SNAP={score:0,ok:0,n:0},WR=false,XS=false,S,M={},stg=[],LOG=[],REC=[],AN=0,RES=0,DT=0,T0=null,DONE=null,AT=false,REL=false,ST=0,AW=false,TA=0,FST=0,SHOT=false,LN=false,PK=0;
const lg=(type,detail)=>{if(LOG.length<400)LOG.push({t:new Date().toISOString(),type,detail:detail||""})};
var SC=MLGScaffold([["tap","Thai and Chinese translations (tap a word)"],["bank","Word bank"],["frames","Sentence frames"]]);
function newAttempt(){SKIP={};SC.reset();AN++;LOG=[];REC=[];RES=0;DT=0;T0=new Date();DONE=null;lg("attempt-start","attempt "+AN)}
function intro(){AT=false;REL=false;WR=false;XS=false;gate();S={name:"",yg:"",fg:"",score:0,streak:0,st:0,q:[],i:0,sok:0,sn:0,ok:0,n:0,txt:[]};M={};stg=[];
g.innerHTML=`<div class="box"><b>Activity goal</b><br>Describe where places are on a map and how a place changed over time, using the correct grammar and linking words.</div>
<div class="box"><b>Learning objectives</b> By the end I can:<ul><li>say where places are using directions and prepositions,</li><li>use the past simple and the passive to describe change,</li><li>link ideas with words like <i>however</i> and <i>overall</i>,</li><li>write clear sentences that compare a map in the past and today.</li></ul></div>
<div class="box"><b>Success criteria</b> 80% or more in each mission and 3 clear sentences in the writing task. Clues you miss come back for a second chance.</div>
<label for="nm"><b>English Name</b></label><input id="nm" autocomplete="off"><label for="yg"><b>Year Group</b></label><input id="yg" autocomplete="off" placeholder="e.g. Year 10"><label for="fg"><b>Form Group</b></label><input id="fg" autocomplete="off" placeholder="e.g. 10B">
<div class="fb" id="er" role="alert" style="color:var(--bad)"></div><button class="btn o" id="go" style="width:100%;font-size:16px;padding:13px">Start the mission</button>`;
$("go").onclick=()=>{const n=$("nm").value.trim(),y=$("yg").value.trim(),f=$("fg").value.trim();if(!n||!y||!f){$("er").textContent="Please fill in your English Name, Year Group and Form Group.";return}
S.name=n;S.yg=y;S.fg=f;AT=true;ST=0;AW=false;newAttempt();lg("fullscreen-status",isFull()?"active at start":"not active");guide()}}
function guide(){lg("guided-example","shown");
g.innerHTML=`<div class="sr"><span>Guided example</span><span>not scored</span></div><p class="q">Look first. Then practise.</p>
<p class="note" style="text-align:left">Tap a word with a dotted line to see <b>中文</b> and <b>ไทย</b>.</p>
<div class="box"><b>Read the map</b><div class="map">${MAP.map(m=>`<div><span>${m[0]}</span>${m[1]}</div>`).join("")}</div><p class="note">North is at the top.</p><p>The <b>café</b> is in the top right-hand <b>corner</b>. The <b>garden</b> is <b>between</b> the gym and the bank.</p></div>
<div class="box"><b>Past simple and passive</b><p>Active: They <b>built</b> a gym. → Passive: A gym <b>was built</b>.</p><p><b>However</b> shows contrast. <b>Overall</b> starts a summary.</p></div>
<div class="row"><button class="btn s" id="sp">🔊 Hear it</button><button class="btn o" id="gx">I am ready</button></div>`;
$("sp").onclick=()=>say("The café is in the top right-hand corner. A gym was built.");$("gx").onclick=()=>begin(0)}
function mk(id,x){return{id,opts:sh(Q[id][1]),...x}}
function begin(n){SNAP={score:S.score,ok:S.ok,n:S.n};XS=false;S.st=n;S.i=0;S.sok=0;S.sn=0;S.q=sh([...Array(ST0[n+1]-ST0[n]).keys()].map(k=>ST0[n]+k)).map(id=>mk(id,{}));
lg("stage-start",NAMES[n]+" | order: "+S.q.map(q=>q.id+1).join(", "));show()}
function head(){return`<div class="pbar"><button class="btn s" data-act="sofar">Save my work so far</button><button class="btn s" data-act="skip">Skip this part</button></div><div class="sofar" id="sofarBox" hidden><p>Save what you have done so far. Finished parts are marked. Next lesson, open the activity again and use <b>Skip this part</b> to go to the part you need.</p><div class="row"><button class="btn" data-act="sofar-pdf">Save PDF</button><button class="btn s" data-act="sofar-copy">Copy My Work</button></div><p class="fb" id="ct"></p></div><div class="dots">${[0,1,2,3,4].map(i=>`<span class="${i<S.st?"c":i==S.st?"d":""}"></span>`).join("")}</div><div class="sr"><span>${NAMES[S.st]} · ${Math.min(S.i+1,S.q.length)}/${S.q.length}</span><span>⭐ ${S.score} · 🔥 ${S.streak}</span></div><div class="pg"><i style="width:${S.i/S.q.length*100}%"></i></div>`}
function show(){if(S.i>=S.q.length)return endStage();const it=S.q[S.i],p=Q[it.id];
const map=it.id<10?`<div class="map">${MAP.map(m=>`<div><span>${m[0]}</span>${m[1]}</div>`).join("")}</div><p class="note">North is at the top of the map.</p>`:"";
g.innerHTML=head()+map+`<p class="q">${esc(p[0])}</p><div class="opts" id="o" role="group" aria-label="Answer choices"></div><div class="row"><button class="btn s" id="sp">🔊 Hear it</button><button class="btn" id="nx" style="display:none">Next →</button></div><div class="fb" id="fb" aria-live="polite"></div>`;
it.opts.forEach(x=>{const b=document.createElement("button");b.className="opt";b.textContent=x;b.onclick=()=>pick(it,x,b);$("o").appendChild(b)});
$("sp").onclick=()=>say(p[0].replace("___","blank"));$("nx").onclick=()=>{S.i++;show()}}
function pick(it,x,b){if(b.disabled)return;const p=Q[it.id],r=p[1][0],ok=x==r;
document.querySelectorAll(".opt").forEach(e=>{e.disabled=1});ok?b.classList.add("c"):b.classList.add("w");
const st=it.rv?6:S.st;REC.push({id:it.id,stage:st+1,q:p[0],shown:it.opts.slice(),chosen:x,correct:r,ok,retry:!!it.r,rv:!!it.rv});
if(!it.rv){const m=M[it.id]=M[it.id]||{ok:0,bad:0};ok?m.ok++:m.bad++}
if(ok){S.streak++;S.score+=10+(S.streak>=3?5:0)}else{S.streak=0;if(!it.r&&!it.rv)S.q.push(mk(it.id,{r:1}))}
if(!it.r&&!it.rv){S.sn++;S.n++;if(ok){S.sok++;S.ok++}}
const sec=Math.max(0,SEC.map(s=>s[1]).filter(s=>it.id>=s).length-1);
