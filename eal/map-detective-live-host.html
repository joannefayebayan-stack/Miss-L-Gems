<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate"><head><meta charset="UTF-8"><meta name="google" content="notranslate"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Map Detective Live - Teacher</title><style>
:root{--bg:#F6FAF9;--card:#fff;--ink:#1F2937;--mut:#5B6572;--teal:#0F766E;--td:#0B5C56;--tl:#E3F3F1;--or:#E08E45;--bd:#DCEAE7;--ok:#1F7A3D;--okb:#E5F5E9;--bad:#B23B32;--badb:#FCEBEA}

*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(circle at 15% 0,var(--tl),transparent 45%),var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,[data-allow]{-webkit-user-select:text;user-select:text}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--td)}.btn:active{transform:translateY(3px);box-shadow:none}.btn:disabled{opacity:.5;cursor:default}
.btn.o{background:linear-gradient(90deg,var(--or),#F0A35E);box-shadow:0 4px 0 #C77530}.btn.s{background:var(--card);color:var(--td);border:1.5px solid var(--teal);box-shadow:0 4px 0 var(--bd)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.mut{color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{padding:1.5rem 2rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
h1{font-size:clamp(24px,3.2vw,38px);color:var(--td);margin:0}h1 small{font-size:.5em;color:var(--or);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h2{margin:0 0 .6rem;font-size:clamp(20px,2.4vw,28px)}
.panel{background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:1.6rem;box-shadow:0 10px 30px rgba(15,118,110,.12);max-width:1200px;margin:0 auto 1rem}
.pill{display:inline-block;background:var(--tl);color:var(--td);border-radius:99px;padding:5px 14px;font-weight:700;font-size:15px}
.seg{display:flex;gap:10px;margin:8px 0 12px}.seg-b{font:inherit;font-weight:700;font-size:22px;padding:10px 26px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer}.seg-b.on{border-color:var(--teal);background:var(--tl);color:var(--td)}
.lob{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:2rem;align-items:start}@media(max-width:800px){.lob{grid-template-columns:1fr}}
.qr{background:#fff;border-radius:18px;padding:12px;border:2px solid var(--bd);line-height:0}.qr svg{width:100%;height:auto}
.code{font-size:clamp(34px,5vw,60px);font-weight:800;letter-spacing:.12em;color:var(--td);margin:.2rem 0}
.url{font-size:13px;word-break:break-all;color:var(--mut)}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.pc{background:var(--tl);border-radius:14px;padding:12px 16px;font-size:19px;font-weight:700}.pc small{display:block;font-weight:400;color:var(--mut);font-size:13px}.pc.off{opacity:.45}
.stem{font-size:clamp(24px,3.4vw,44px);font-weight:800;line-height:1.25;margin:.4rem 0 1.2rem}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0}.map div{background:var(--tl);border-radius:10px;text-align:center;padding:5px 2px;font-size:14px;font-weight:700}.map span{display:block;font-size:26px}.qw{display:grid;grid-template-columns:1fr;gap:1.4rem}.qw.m{grid-template-columns:minmax(220px,290px) 1fr}@media(max-width:800px){.qw.m{grid-template-columns:1fr}}.qw .stem{margin-top:0}
.hopts{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.hopts{grid-template-columns:1fr}}
.ho{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--bd);border-bottom-width:6px;border-radius:18px;padding:18px 20px;font-size:clamp(22px,2.8vw,34px);font-weight:700}
.ho b{flex:none;width:52px;height:52px;border-radius:50%;background:var(--tl);color:var(--td);display:grid;place-items:center;font-size:26px}
.ho.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.ho.ok b{background:var(--ok);color:#fff}.ho.dim{opacity:.45}.ho i{margin-left:auto;font-style:normal;font-size:20px;color:var(--mut)}
.sb{margin-top:1.2rem}.sbr{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:14px;padding:10px 16px;margin:8px 0;font-size:clamp(18px,2vw,26px);font-weight:700}.sbr .rk{flex:none;width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:18px}.sbr .nm{flex:1}.sbr .pt{color:var(--td)}.sbr .d{font-size:.7em;color:var(--ok)}
.pod{display:flex;gap:16px;align-items:flex-end;justify-content:center;margin:1.2rem 0;min-height:260px}.pod div{flex:1;max-width:240px;text-align:center;background:var(--tl);border-radius:16px 16px 0 0;padding:14px 8px;font-weight:800;font-size:clamp(18px,2.2vw,28px)}.pod .p1{height:260px;background:linear-gradient(180deg,#F6D98C,#E8B64F)}.pod .p2{height:200px}.pod .p3{height:150px}.pod small{display:block;font-weight:600;font-size:.6em;color:var(--mut)}
.rule{background:var(--tl);border-left:6px solid var(--or);border-radius:12px;padding:12px 18px;font-size:clamp(16px,1.8vw,22px);margin-top:14px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);padding:10px;border-radius:10px;overflow:auto;max-height:300px}
</style>
<style id="mlg-pastel">
:root{color-scheme:light;--bg:#F7FCFA;--card:#fff;--w:#fff;--ink:#2F3A4A;--tx:#2F3A4A;--mut:#5F6B7A;--mute:#5F6B7A;--mu:#5F6B7A;--muted:#5F6B7A;--bd:#D5EBE1;--line:#D5EBE1;
--teal:#7CC4A9;--t:#7CC4A9;--ac:#7CC4A9;--acc:#7CC4A9;--brand:#7CC4A9;--td:#1F4D40;--teal-d:#1F4D40;--tealD:#1F4D40;--acd:#1F4D40;--acc2:#9FD3BE;
--tl:#E4F5EE;--teal-l:#E4F5EE;--tealL:#E4F5EE;--acl:#E4F5EE;--brand2:#E4F5EE;--purple:#1F4D40;--purple-l:#E4F5EE;--acx:#1F4D40;
--or:#F5C49A;--o:#F5C49A;--orange:#F5C49A;--go:#F5C49A;--gold:#F5C49A;--hot:#E8A39B;--od:#8A5A24;--god:#8A5A24;
--ok:#1F6B45;--okt:#1F6B45;--okb:#E3F5EA;--ok-bg:#E3F5EA;--bad:#A63A32;--bat:#A63A32;--badt:#A63A32;--bab:#FCEBE8;--badb:#FCEBE8;--bad-bg:#FCEBE8}
.btn,.btn.o,button.btn,.next,.go,.start,.play,.vid{background:#BFE6D6!important;color:#1F4D40!important;box-shadow:0 3px 0 #9FD3BE}
.btn:hover,.next:hover,.go:hover,.start:hover,.play:hover,.vid:hover{background:#9FD3BE!important}
.btn.s{background:#fff!important;color:#1F4D40!important;border-color:#7CC4A9;box-shadow:0 3px 0 #D5EBE1}

.fb,.toast{color:inherit}.toast{color:#1F6B45}
.pg i,.bar i,.fill{background:#7CC4A9!important}
.pod .p1{background:#BFE6D6}
:focus-visible{outline:3px solid #1F4D40;outline-offset:2px}
h1,h2,.box b,.fbk b,.stat b,.ltr,.eyebrow,.eye,.task h4,.end h2{color:#1F4D40}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const PO={};

return MLGPDF.wida({name:p.name,standard:"Social and Instructional Language",use:"Explain",domain:"Vocabulary and grammar recognition",pct:pc,target:3,at:"Choosing words and phrases to provide precise details, descriptions, comparisons, and ordered procedures",below:[2,"Sequencing narratives or informational text using linking words and phrases"],opening:p.name+" answered "+okN+" of "+n+" clues correctly ("+pc+"%).",strengths:st,develop:dv}).slice(1)}

const app=$("app");

const mkCode=()=>{const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s};
function buildSeq(n){const out=[];SEC.forEach((s,m)=>{const ids=[...Array(ST0[m+1]-ST0[m]).keys()].map(k=>ST0[m]+k),k=Math.max(1,Math.min(ids.length,Math.round(n*ids.length/50)));out.push(...sh(ids).slice(0,k))});return out}
const joinUrl=()=>{const u=new URL("map-detective-live.html",location.href);u.search="";u.hash="";u.searchParams.set("c",code);return u.href};

/* ---------- connections ---------- */
function onConn(conn){conn.on("data",d=>{try{handle(conn,d)}catch(e){}});
conn.on("close",()=>{const p=plist().find(x=>x.conn===conn);if(!p)return;p.on=false;if(phase=="lobby")drawLobby();else if(phase=="q"){drawHud();maybeReveal()}});
conn.on("error",()=>{})}
const clean=s=>String(s==null?"":s).replace(/\s+/g," ").trim().slice(0,40);
function handle(conn,d){if(!d||typeof d!="object")return;
if(d.t=="join"){const name=clean(d.name),yg=clean(d.yg),fg=clean(d.fg);
if(!name||!yg||!fg){conn.send({t:"err",msg:"Please fill in all three boxes."});return}

if(p){if(p.on&&p.conn!==conn&&p.conn&&p.conn.open){conn.send({t:"err",msg:"That name is already in this game. Use a different English Name."});return}
p.conn=conn;p.on=true;conn.send({t:"joined",re:true});resync(p);if(phase=="lobby")drawLobby();else if(phase=="q")drawHud();return}
if(phase!="lobby"){conn.send({t:"err",msg:"This game has already started. Ask your teacher."});return}
if(P.size>=8){conn.send({t:"err",msg:"This game is full."});return}
p={key,name,yg,fg,conn,on:true,score:0,att:1,ans:{},hist:[],dep:0,warn:0,reset:0,shot:0,fsx:0};P.set(key,p);
conn.send({t:"joined"});drawLobby();return}
const p=plist().find(x=>x.conn===conn);if(!p)return;
if(d.t=="ans"){if(phase!="q"||d.qi!==qi||p.ans[qi]!==undefined)return;const c=Number.isInteger(d.c)?d.c:-1;if(c<0||c>=cur.opts.length)return;p.ans[qi]=c;drawHud();maybeReveal();return}
if(d.t=="reset"){p.reset++;if(phase=="q"||phase=="reveal"){const m=mOf(cur.id);p.hist=p.hist.filter(h=>h.m!=m);p.score=p.hist.filter(h=>h.ok).length*1000;Object.keys(p.ans).forEach(k=>{if(mOf(seq[+k])==m)delete p.ans[k]});if(phase=="q")drawHud()}return}
if(d.t=="ev"){if(d.k=="departure")p.dep++;else if(d.k=="warning")p.warn++;else if(d.k=="screenshot")p.shot++;else if(d.k=="fs-exit")p.fsx++}}
function resync(p){if(phase=="q")send(p,{t:"q",qi,n:seq.length,m:mOf(cur.id),opts:cur.opts,a:p.ans[qi]===undefined?null:p.ans[qi]});
else if(phase=="reveal"){const h=p.hist[p.hist.length-1];if(h)send(p,resMsg(p,h))}
else if(phase=="end")send(p,endMsg(p))}

/* ---------- game ---------- */
function startGame(){if(!live().length)return;phase="started";qi=-1;next()}
function next(){qi++;if(qi>=seq.length)return finish();

plist().forEach(p=>send(p,{t:"q",qi,n:seq.length,m:mOf(id),opts:cur.opts,a:null}));drawQ()}
function drawQ(){const id=cur.id,m=mOf(id),map=id<10?`<div class="map">${MAP.map(x=>`<div><span>${x[0]}</span>${x[1]}</div>`).join("")}</div>`:"";
app.innerHTML=`<div class="top"><h1>🕵️ Map Detective <small>Live</small></h1><span class="pill">${esc(SEC[m][0])}</span><span class="pill">Clue ${qi+1} of ${seq.length}</span><span class="pill" id="hud"></span></div>
<div class="panel"><div class="qw${map?" m":""}">${map}<div><div class="stem" data-allow>${esc(Q[id][0])}</div><div class="hopts">${cur.opts.map((o,i)=>`<div class="ho"><b>${LET[i]}</b>${esc(o)}</div>`).join("")}</div></div></div>
<div class="row"><button class="btn s" id="rv">Show the answer now</button></div></div>`;
$("rv").onclick=reveal;drawHud()}

function maybeReveal(){if(phase!="q")return;const l=live();if(l.length&&l.every(p=>p.ans[qi]!==undefined))setTimeout(()=>{if(phase=="q")reveal()},600)}
function resMsg(p,h){const rk=ranked().findIndex(x=>x===p);return{t:"res",qi:h.qi,n:seq.length,m:h.m,ok:h.ok,pts:h.ok?1000:0,total:p.score,rank:p.rank,of:P.size,stem:Q[h.id][0],correct:h.opts[h.ci],chosen:h.c===undefined?null:h.opts[h.c]}}

const sb=ranked().map(p=>{const h=p.hist[p.hist.length-1];return`<div class="sbr"><span class="rk">${p.rank}</span><span class="nm">${esc(p.name)}${p.on?"":" (disconnected)"}</span>${h&&h.ok?'<span class="d">+1000</span>':""}<span class="pt">${p.score}</span></div>`}).join("");

<div class="panel"><div class="stem" data-allow>${esc(Q[id][0])}</div><div class="hopts">${cur.opts.map((o,i)=>`<div class="ho ${i==cur.ci?"ok":"dim"}"><b>${i==cur.ci?"✓":LET[i]}</b>${esc(o)}<i>${counts[i]}</i></div>`).join("")}</div>
