<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sentence Sorter</title>
<style>
:root{--teal:#0F766E;--teal-d:#0B5C56;--teal-l:#E3F3F1;--orange:#E08E45;--purple:#7C5CBF;--purple-l:#EEE8FA;--ink:#1F2937;--muted:#5B6572;--bg:#F6FAF9;--card:#fff;--line:#DCEAE7;--ok-bg:#E5F5E9;--ok:#1F7A3D;--bad-bg:#FCEBEA;--bad:#B23B32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;display:flex;justify-content:center;padding:1.5rem 1rem}
.wrap{width:100%;max-width:680px}
header{text-align:center;margin-bottom:1rem}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--orange);text-transform:uppercase}
h1{font-size:28px;margin:4px 0;color:var(--teal-d)}
header p{margin:0;color:var(--muted);font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.4rem}
.stats{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.stats b{color:var(--ink)}
.bar{height:8px;background:var(--teal-l);border-radius:5px;overflow:hidden;margin-bottom:16px}
.fill{height:100%;background:var(--teal);transition:width .25s}
.badge{display:inline-block;background:var(--teal-l);color:var(--teal-d);font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:100px;margin-bottom:12px}
.badge.p{background:var(--purple-l);color:var(--purple)}
.text{font-size:23px;font-weight:700;padding:20px 16px;background:var(--bg);border-left:5px solid var(--teal);border-radius:10px;margin-bottom:8px}
.ask{font-size:14px;color:var(--muted);margin:0 0 14px}
.opts{display:grid;gap:10px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{font-size:15.5px;font-weight:700;padding:13px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:center}
.opts:not(.three) .opt{text-align:left;font-weight:600}
.opt .e{display:block;font-size:24px}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--teal-l)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:14.5px}
.fb .v{font-weight:800}.fb.good .v{color:var(--ok)}.fb.bad .v{color:var(--bad)}
.next,.go,.sec{border:none;font-weight:800;border-radius:11px;cursor:pointer;font-size:15px;padding:11px 20px}
.next{display:none;float:right;margin-top:12px;background:var(--teal);color:var(--card)}
.go{display:block;width:100%;background:var(--orange);color:#1F2937;font-size:16px;padding:14px;margin-top:14px}
.sec{background:var(--card);color:var(--teal-d);border:2px solid var(--teal);margin:6px 6px 0 0}
.box{background:var(--teal-l);border-radius:12px;padding:11px 14px;margin:10px 0;font-size:14px}
.box b{color:var(--teal-d)}
.box.p{background:var(--purple-l)}.box.p b{color:var(--purple)}
.box.o{background:var(--bad-bg)}.box.o b{color:var(--bad)}
input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:11px;padding:11px 13px;font:inherit;background:var(--card);color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--teal)}
textarea{min-height:64px;resize:vertical}
.task{margin:14px 0}.task h4{margin:0 0 4px;color:var(--teal-d);font-size:15px}
.ticks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:5px}
.ticks span.y{color:var(--ok);font-weight:700}
.end{text-align:center}.end h2{color:var(--teal-d);margin:4px 0}.big{font-size:54px}
.grid{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--bg);border-radius:12px;padding:10px 18px}
.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:21px;color:var(--teal-d)}
.miss{text-align:left;font-size:13.5px}.miss div{padding:5px 0;border-bottom:1px solid var(--line)}
.toast{font-size:13px;color:var(--ok);min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{border:2px solid var(--purple);background:var(--card);color:var(--purple);font-weight:700;font-size:13.5px;padding:5px 12px;border-radius:100px;cursor:pointer}.chip:hover{background:var(--purple-l)}.vid{display:block;text-align:center;text-decoration:none;background:var(--orange);color:#1F2937;font-weight:800;padding:14px;border-radius:12px;margin:10px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9;padding:1rem}.ovb{background:var(--card);border-radius:16px;padding:1.5rem;max-width:420px;text-align:center}.ovb h2{color:var(--bad);margin:0 0 6px}
.fbk{text-align:left;font-size:13.5px;background:var(--teal-l);border-radius:12px;padding:12px 14px;margin:12px 0}.fbk b{color:var(--teal-d)}.fbk p{margin:6px 0}
.skip{display:block;width:100%;margin-top:12px;background:var(--card);color:var(--muted);border:2px dashed var(--line);border-radius:11px;padding:10px;font-weight:700;font-size:14px;cursor:pointer}
.skip:hover{border-color:var(--teal);color:var(--teal-d)}
.tag{display:inline-block;background:var(--bad-bg);color:var(--bad);font-size:12px;font-weight:700;padding:4px 10px;border-radius:100px;margin-left:6px}
.ticks span.sk{color:var(--bad);font-weight:700}
.rl{display:flex;gap:8px;margin:8px 0}.rl input{flex:1}
#sheet{display:none}
@media print{body>*:not(#sheet){display:none!important}body{display:block!important;background:#fff!important;padding:0!important}#sheet{display:block!important;color:#000;background:#fff;font-size:11pt}#sheet h3{margin:14px 0 4px;color:#0B5C56}#sheet p{margin:2px 0;white-space:pre-wrap}#sheet p.ok{color:#1F7A3D}#sheet p.bad{color:#B23B32}#sheet p.mut{color:#555}}
@media(max-width:480px){.opts.three{grid-template-columns:1fr}.text{font-size:20px}}
</style>

--teal:#7CC4A9;--t:#7CC4A9;--ac:#7CC4A9;--acc:#7CC4A9;--brand:#7CC4A9;--td:#1F4D40;--teal-d:#1F4D40;--tealD:#1F4D40;--acd:#1F4D40;--acc2:#9FD3BE;
--tl:#E4F5EE;--teal-l:#E4F5EE;--tealL:#E4F5EE;--acl:#E4F5EE;--brand2:#E4F5EE;--purple:#1F4D40;--purple-l:#E4F5EE;--acx:#1F4D40;
--or:#F5C49A;--o:#F5C49A;--orange:#F5C49A;--go:#F5C49A;--gold:#F5C49A;--hot:#E8A39B;--od:#8A5A24;--god:#8A5A24;
--ok:#1F6B45;--okt:#1F6B45;--okb:#E3F5EA;--ok-bg:#E3F5EA;--bad:#A63A32;--bat:#A63A32;--badt:#A63A32;--bab:#FCEBE8;--badb:#FCEBE8;--bad-bg:#FCEBE8}
.btn,.btn.o,button.btn,.next,.go,.start,.play,.vid{background:#BFE6D6!important;color:#1F4D40!important;box-shadow:0 3px 0 #9FD3BE}
.btn:hover,.next:hover,.go:hover,.start:hover,.play:hover,.vid:hover{background:#9FD3BE!important}
.btn.s{background:#fff!important;color:#1F4D40!important;border-color:#7CC4A9;box-shadow:0 3px 0 #D5EBE1}
.sec,.pick,.ghost,button.alt{background:#fff;color:#1F4D40;border-color:#7CC4A9}
.sel{background:#BFE6D6!important;border-color:#9FD3BE!important;color:#1F4D40!important}
.seg-b.on{background:#BFE6D6;border-color:#9FD3BE;color:#1F4D40}
.sbr .rk,.ho.ok b{background:#BFE6D6;color:#1F4D40}
.fb,.toast{color:inherit}.toast{color:#1F6B45}
.pg i,.bar i,.fill{background:#7CC4A9!important}
.pod .p1{background:#BFE6D6}
:focus-visible{outline:3px solid #1F4D40;outline-offset:2px}
h1,h2,.box b,.fbk b,.stat b,.ltr,.eyebrow,.eye,.task h4,.end h2{color:#1F4D40}
</style>

<body>
<div class="wrap">
<header><div class="eyebrow">Years 10 &amp; 11 EAL · Grammar</div><h1>Sentence Sorter 🧩🚂✅</h1><p>Find fragments and run-ons. Fix them. Write your own.</p></header>
<div class="card"><div id="g"></div></div>
</div>
<script>
const SPOT=[
["I like pizza.","s","It has a subject (I) and a verb (like). The idea is finished."],
["Because it was late.","f","<b>Because</b> makes the idea unfinished. What happened because it was late?"],
["It was raining we stayed inside.","r","Two sentences are stuck together with no punctuation or joining word."],
["The bus was late, so we waited.","s","Two complete ideas joined correctly with a comma + <b>so</b>."],
["Running in the park.","f","There is no subject and no full verb. Who is running?"],
["She was tired, she went to bed.","r","A comma is not strong enough. Use a comma + <b>so</b>, or a full stop."],
["We played football after school.","s","Subject + verb + finished idea."],
["My best friend at school.","f","There is a subject but no verb. What did your friend do?"],
["I love music I play guitar every day.","r","Two ideas with no break. Add <b>and</b>, or start a new sentence."],
["When the bell rang.","f","<b>When</b> starts an unfinished idea. What happened when the bell rang?"],
["My mum cooks dinner every night.","s","Complete: who (my mum), what (cooks), when (every night)."],
["The shop was closed we went home.","r","Two complete sentences are joined without punctuation."]
];
const FIX=[
["I was hungry I ate lunch.","I was hungry, so I ate lunch.",["I was hungry, I ate lunch.","I was hungry I ate, lunch."],"Comma + <b>so</b> joins two ideas correctly."],
["Because the road was flooded.","Because the road was flooded, we stayed home.",["Because the road was flooded we.","The road because was flooded."],"A dependent clause needs a main clause after it."],
["My sister likes music she plays guitar.","My sister likes music, and she plays guitar.",["My sister likes music, she plays guitar.","My sister likes, music she plays guitar."],"Add comma + <b>and</b>. A comma alone is not enough."],
["Walking to school.","I am walking to school.",["Walking to school now.","Walking to school, I."],"Add a subject (<b>I</b>) and a helping verb (<b>am</b>)."],
["It was cold, we wore jackets.","It was cold, so we wore jackets.",["It was cold we wore jackets.","It was cold, we, wore jackets."],"A comma splice needs a joining word: <b>so</b>."],
["After we ate dinner.","After we ate dinner, we did our homework.",["After we ate dinner we.","We after ate dinner."],"Finish the idea with a main clause."]
];
const WT=[
["Sentence 1: Write a simple sentence about your weekend.",null,3,"Needs: capital letter, end mark, 3+ words"],
["Sentence 2: Write a sentence with <b>because</b>.",/\bbecause\b/i,5,"Use the word because"],
["Sentence 3: Write one sentence with <b>and</b>, <b>but</b> or <b>so</b> (use a comma before it).",/,\s*(and|but|so)\b/i,6,"Use , and / , but / , so"]
];
const el=document.getElementById("g");
const VIDEO_URL="https://www.youtube.com/watch?v=R-VRAemIvbI";const VIDEO_TOPIC="the history of Halloween";
const SEQ=["First","Next","Then","After that","Finally"];
const SUB=/^(because|although|though|when|whenever|while|after|before|if|unless|since|which|who|as)\b/i;
let tabs=0,guard=false,last=0,skipped=false,notes="",ended="",pdone=false,LG=[],queue=[],qp=0,WS=[false,false,false],cls="";
const LB={s:"Sentence",f:"Fragment",r:"Run-on"};
function ov(h,b){let o=document.getElementById("ov");if(o)o.remove();o=document.createElement("div");o.id="ov";o.className="ov";
o.innerHTML=`<div class="ovb"><h2>${h}</h2><p>${b}</p><button class="go" id="ovk">Back to writing</button></div>`;document.body.appendChild(o);document.getElementById("ovk").onclick=()=>o.remove()}
function lost(){if(!guard||Date.now()-last<1500)return;last=Date.now();tabs++;
if(tabs===1)ov("⚠️ First warning","You left this tab. Stay on this page while you write. If you leave again, you will get a final warning.");
else if(tabs===2)ov("🛑 Final warning","You left this tab again. If it happens one more time, your paragraph will be submitted as it is.");
else{guard=false;const t=document.getElementById("pp");if(t)P=t.value.trim();ended="Paragraph was submitted automatically after repeated tab changes.";pdone=true;const o=document.getElementById("ov");if(o)o.remove();end()}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)lost()});
function watch(){guard=false;
el.innerHTML=`<div class="bar"><div class="fill" style="width:100%"></div></div><div class="badge p">Round 4 · Watch and write 🎬</div>
<p style="font-size:14px;margin:0 0 4px"><b>Step 1:</b> Watch <i>Halloween History | National Geographic</i>. Take notes in order: first, next, then...<br><small>Tip: turn on subtitles (CC) and slow the speed if you need to.</small></p>
<a class="vid" href="${VIDEO_URL}" target="_blank" rel="noopener">▶ Watch the video (opens YouTube)</a>
<p style="font-size:14px;margin:0 0 4px"><b>Step 2:</b> Write your notes. You can read them while you write.</p>
<textarea id="nt" style="min-height:110px" placeholder="My notes..."></textarea>
<div class="box o"><b>Before you write:</b> the paragraph is a test. Open and watch the video <b>now</b>, not while you write. On the writing page, if you leave the tab you get a <b>first warning</b>, then a <b>final warning</b>. After that, your paragraph is submitted.</div>
<button class="go" id="rd">✅ I’m ready to write the paragraph</button>
<button class="sec" id="sk" style="width:100%;margin-top:10px">Skip for now (I’m not ready yet)</button>`;
document.getElementById("nt").value=notes;
document.getElementById("rd").onclick=()=>{notes=document.getElementById("nt").value.trim();skipped=false;para()};
document.getElementById("sk").onclick=()=>{notes=document.getElementById("nt").value.trim();skipped=true;P="";pdone=false;end()}}
function para(){tabs=0;guard=true;
el.innerHTML=`<div class="badge p">Paragraph test ✍️ · Stay on this page</div>
<p style="font-size:14px;margin:0 0 4px">Write a paragraph: <b>${VIDEO_TOPIC}</b>. Use <b>sequence words</b> (tap to add):</p>
<div class="chips">${SEQ.map(x=>`<button class="chip">${x}</button>`).join("")}</div>
${notes?`<div class="box"><b>My notes:</b><br>${notes.replace(/</g,"&lt;").replace(/\n/g,"<br>")}</div>`:""}
<textarea id="pp" style="min-height:170px" placeholder="First, ..."></textarea><div class="ticks" id="pt"></div>
<div class="box">💡 Put a comma after sequence words: <i>First, people lit bonfires.</i> Write 5 to 8 complete sentences in the order things happened.</div>
<button class="go" id="f2">Finish ✔</button>`;
const ta=document.getElementById("pp");
const ck=()=>{const v=ta.value.trim(),n=v?v.split(/\s+/).length:0;
document.getElementById("pt").innerHTML=SEQ.map(x=>{const y=new RegExp("\\b"+x+"\\b","i").test(v);return `<span class="${y?"y":""}">${y?"✔":"○"} ${x}</span>`}).join("")+`<span class="${n>=50?"y":""}">${n>=50?"✔":"○"} 50+ words (${n})</span><span class="${/[.!?]$/.test(v)?"y":""}">${/[.!?]$/.test(v)?"✔":"○"} End mark</span>`};
ta.oninput=ck;ck();
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ta.value+=(ta.value&&!/\s$/.test(ta.value)?" ":"")+c.textContent+", ";ta.focus();ck()});
document.getElementById("f2").onclick=()=>{guard=false;P=ta.value.trim();pdone=true;end()}}
const WL=["","Entering","Emerging","Developing","Expanding","Bridging"];
const WD=["","can supply words and short answers with support","can write lists, notes and simple texts with models and organizers","can compose short narrative and expository pieces and check them against criteria","can compose text for different purposes, justify ideas and revise using feedback","can produce extended, detailed pieces and explain processes with detail"];
const WN=["","Write full sentences about the video, not single words.","Join ideas with and, but, so, because and use 3+ sequence words.","Add more detail and use a wider range of connectors (although, when, which).","Vary your sentence openings and add precise topic vocabulary.","Keep refining style and precision."];
function fb(t){const sents=t.split(/(?<=[.!?])\s+/).filter(x=>x.trim()),words=t.toLowerCase().match(/[a-z']+/g)||[],n=words.length,sn=sents.length;
const seq=SEQ.filter(x=>new RegExp("\\b"+x+"\\b","i").test(t)).length;
const conn=(t.match(/\b(because|but|so|and|although|however|when|while|which|who|if|since|also)\b/gi)||[]).length;
const uniq=new Set(words).size/Math.max(n,1),er=[];
sents.forEach(x=>{x=x.trim();const w=x.split(/\s+/).length,q=x.slice(0,45)+(x.length>45?"…":"");
if(!/^[A-Z]/.test(x))er.push("No capital letter: “"+q+"”");else if(!/[.!?]$/.test(x))er.push("No end mark: “"+q+"”");
if(SUB.test(x)&&!/,/.test(x)&&w<9)er.push("Possible fragment: “"+q+"”");
const m=x.match(/^([^,]+),\s*(he|she|it|they|we|i)\s/i);if(m&&!SUB.test(x)&&m[1].trim().split(/\s+/).length>=4)er.push("Possible comma splice: “"+q+"”");
const c=x.match(/^(first|next|finally|after that)\b(?!,)/i);if(c)er.push("Add a comma after “"+c[1]+"”");
if(w>30)er.push("Very long sentence (possible run-on): “"+q+"”")});
let L=1;if(n>=15&&sn>=2)L=2;if(n>=40&&sn>=4)L=3;if(n>=75&&sn>=6&&conn>=5&&seq>=3&&er.length<=3)L=4;if(n>=110&&sn>=8&&conn>=8&&seq>=4&&er.length<=1&&uniq>.55)L=5;
const rows=[
["WIDA Can Do (Grades 9–12) · Writing","Level "+L+" "+WL[L]+" (indicative): "+WD[L]+". Next step: "+WN[L]],
["Task response",n+" words, "+sn+" sentences. "+(n>=80?"Good length for the task.":"Aim for 80+ words and 5 to 8 sentences about the video.")],
["Coherence and cohesion",seq+"/5 sequence words and "+conn+" linking words used. "+(seq>=4?"The order of ideas is clear.":"Use more of First, Next, Then, After that, Finally to show the order.")],
["Lexical resource","Word variety "+Math.round(uniq*100)+"%. "+(uniq>.6?"Good range of words.":"Try to use more topic words from the video instead of repeating the same words.")],
["Grammatical range and accuracy",er.length?"Check "+er.length+" thing(s) before sending: "+er.slice(0,3).join("; ")+".":"No obvious sentence errors found. Try adding a sentence with although, when or which."]];
return{L,rows}}
const CLR={ok:[31,122,61],bad:[178,59,50],mut:[91,101,114]};
const cl=x=>String(x==null?"":x).replace(/[^\x20-\x7E\u00A0-\u00FF\u2018\u2019\u201C\u201D\u2013\u2014\n]/g,"");
const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=x=>String(x).replace(/<[^>]+>/g,"");
function printSheet(items,fn){const o=document.getElementById("sheet");if(o)o.remove();const sh2=document.createElement("div");sh2.id="sheet";
sh2.innerHTML=items.map(x=>x.h?`<h3>${esc(x.h)}</h3>`:`<p class="${x.c||""}">${x.b?"<b>"+esc(x.t)+"</b>":esc(x.t)}</p>`).join("");document.body.appendChild(sh2);
const old=document.title;document.title=fn.replace(/\.pdf$/,"");window.onafterprint=()=>{sh2.remove();document.title=old};window.print()}
async function mkpdf(items,fn,spec){const ts=document.getElementById("ts");let blob=null;
try{blob=window.MLGPDF.build(spec())}catch(e){ts.textContent="Opening the print window. Choose “Save as PDF”.";printSheet(items,fn);return}
try{await window.MLGPDF.deliver(blob,fn);ts.textContent="PDF saved. Send it to your teacher."}
catch(err){ts.textContent=err&&err.code==="declined"?"Save cancelled.":"PDF could not be saved. Try again or use “Copy my work”."}}
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
let Q,i,score,streak,ok,miss,name="",W=[],P="";
function intro(){skipped=false;tabs=0;ended="";P="";notes="";guard=false;pdone=false;LG=[];queue=[];qp=0;WS=[false,false,false];W=[];el.innerHTML=`<div class="box"><b>✅ Sentence</b> = subject + verb + a finished idea.<br><i>I like pizza.</i></div>
<div class="box p"><b>🧩 Fragment</b> = a piece of a sentence. Something is missing.<br><i>Because it was late.</i></div>
<div class="box o"><b>🚂 Run-on</b> = two sentences stuck together.<br><i>It was raining we stayed inside.</i></div>
<p style="font-size:14px;margin:12px 0 4px">4 rounds: <b>1 Spot it</b> (12) · <b>2 Fix it</b> (6) · <b>3 Write it</b> (3 sentences) · <b>4 Watch and write</b> (paragraph)</p>
<div class="box">⏭ Not sure? Press <b>Skip for now</b> on any question. Skipped questions come back at the end. If you skip again, they are shown as <b>not answered</b> in your PDF.</div>
<div class="rl"><input type="text" id="nm" placeholder="Your name (required)" aria-required="true"><input type="text" id="cn" placeholder="Class, e.g. 10A (required)" aria-required="true"></div><p class="fb bad" id="er" style="margin:0;min-height:20px;font-weight:700"></p><button class="go" id="s" style="margin-top:6px">Let’s play!</button>`;
const nmI=document.getElementById("nm"),cnI=document.getElementById("cn"),erE=document.getElementById("er");
const bad=i=>{i.style.borderColor="var(--bad)"};[nmI,cnI].forEach(x=>x.oninput=()=>{x.style.borderColor="";erE.textContent=""});
