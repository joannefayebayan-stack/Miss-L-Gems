<html lang="en" translate="no" class="notranslate"><head><meta charset="UTF-8"><meta name="google" content="notranslate"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Map Detective</title>
<style>
:root{--bg:#F6FAF9;--card:#fff;--ink:#1F2937;--mut:#5B6572;--teal:#0F766E;--td:#0B5C56;--tl:#E3F3F1;--or:#E08E45;--bd:#DCEAE7;--ok:#1F7A3D;--okb:#E5F5E9;--bad:#B23B32;--badb:#FCEBEA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1716;--card:#16211F;--ink:#E8EEEC;--mut:#A5B3B0;--teal:#3CB5A9;--td:#5EDACB;--tl:#12312E;--bd:#2A3B38;--ok:#8EDBA3;--okb:#16341F;--bad:#F0A39C;--badb:#3A1C1A}}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(circle at 15% 0,var(--tl),transparent 45%),var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;padding:1.4rem 1rem;min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.wrap{max-width:660px;margin:auto}h1{font-size:28px;color:var(--td);margin:0;text-align:center}.sub{text-align:center;color:var(--mut);margin:2px 0 14px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:1.4rem;box-shadow:0 10px 30px rgba(15,118,110,.12)}
.box{background:var(--tl);border-left:5px solid var(--or);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14.5px}.box b{color:var(--td)}.box ul{margin:4px 0;padding-left:20px}
.sr{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.pg{height:11px;background:var(--tl);border-radius:6px;overflow:hidden;margin:6px 0 12px}.pg i{display:block;height:100%;background:var(--teal);transition:width .25s}

#ac{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:1rem}.acb{background:var(--card);border-radius:18px;padding:1.4rem;max-width:420px;border:2px solid var(--or)}.acb h3{margin:0 0 8px}

#pp{display:none}@media print{.wrap,#ac,#fs{display:none!important}#pp{display:block!important}#pp pre{max-height:none;overflow:visible;font-size:10pt;background:none}body{background:#fff;color:#000}}

</style></head><body><div class="wrap"><h1>🕵️ Map Detective</h1><p class="sub">50 clues · 5 missions</p>
<div class="card" id="g"></div></div><div id="ac" role="alertdialog" aria-live="assertive"></div><div id="fs" role="dialog" aria-modal="true" aria-label="Paused"></div><div id="pp"></div>
<script>
const MAP=[["📚","Library"],["🅿️","Car park"],["☕","Café"],["🏋️","Gym"],["🌳","Garden"],["🏦","Bank"],["🛍️","Shop"],["🚌","Bus stop"],["🏫","School"]];
const SEC=[["Map Reader 🗺️",0],["Time Travel ⏳",10],["Switch It 🔄",22],["Link Up 🔗",32],["Final Case ✅",42]];
// First answer in each list is the correct one (options are shuffled when shown).
const Q=[
["The garden is in the ___ of the map.",["middle","corner","top","bottom"]],
["The library is in the top ___ corner.",["left","right","middle","centre"]],
["The car park is ___ the library and the café.",["between","opposite","behind","under"]],
["The gym is ___ the bank.",["opposite","in front of","behind","inside"]],
["The bus stop is ___ the garden.",["south of","north of","east of","west of"]],
["The café is in the top ___ corner.",["right","left","middle","bottom"]],
["The school is in the bottom right-hand ___.",["corner","side","middle","edge"]],
["The bank is ___ the garden.",["next to","behind","between","inside"]],
["The shop is ___ the bus stop.",["west of","east of","north of","south of"]],
["The car park is ___ the garden.",["north of","south of","east of","west of"]],
["They ___ the old library last year.",["moved","move","moves","moving"]],
["The college ___ a new gym in 2010.",["built","builded","build","builds"]],
["Workers ___ many old trees.",["cut","cutted","cuts","cutting"]],
["The old café ___ a bookshop.",["became","becomed","become","becomes"]],
["They ___ a pond in the park.",["dug","digged","dig","digs"]],
["The city ___ the roads in 1998.",["expanded","expand","expands","expanding"]],
["Which verb is irregular?",["make","move","create","expand"]],
["Which verb is regular?",["develop","put","build","dig"]],
["In 1995 there ___ one car park.",["was","were","is","be"]],
["There ___ two cafés in 2005.",["were","was","are","be"]],
["The town ___ a lot between 2000 and 2020.",["changed","change","changes","changing"]],
["They ___ the bus stop to the left.",["put","putted","puts","puting"]],
["The gym ___ in 2010.",["was built","built","is built","were built"]],
["New trees ___ in the park.",["were planted","was planted","planted","are plant"]],
["The old library ___.",["was demolished","demolished","is demolish","were demolished"]],
["Two cafés ___ to the site.",["were added","was added","added","adds"]],
["Make it passive: They moved the bus stop.",["The bus stop was moved.","The bus stop moved.","The bus stop is moving.","They were moved."]],
["Which sentence is passive?",["A gym was built.","They built a gym.","A gym builds.","They are building a gym."]],
["Which sentence is active?",["The council expanded the park.","The park was expanded.","Trees were planted.","A pond was dug."]],
["A new road ___ last year.",["was constructed","constructed","were constructed","is construct"]],
["Two houses ___ to make space.",["were knocked down","was knocked down","knocked down","knock down"]],
["The passive is formed with:",["was / were + past participle","is + -ing","have + -ed","will + verb"]],
["The old gym was small. ___, the new gym is large.",["However","In addition","So","Because"]],
["A pool was built. ___, a café was added.",["In addition","However","Whereas","But"]],
["In 2005 there was a car park, ___ now there is a garden.",["whereas","so","also","then"]],
["___, the college grew and became more modern.",["Overall","Firstly","Because","Before"]],
["Which is the best introduction?",["The two maps show changes to a college between 2005 and today.","I think college is good.","Maps are boring.","Let me tell you about my town."]],
["Which word means 'knocked down'?",["demolished","built","moved","planted"]],
["Which word means 'got bigger'?",["expanded","shrank","removed","replaced"]],
["Which word means 'made'?",["created","destroyed","removed","closed"]],
["Which word means 'moved to a new place'?",["relocated","demolished","expanded","planted"]],
["The wasteland was ___ a park.",["transformed into","next to","opposite","between"]],
["The library is ___ the café and the gym.",["between","among","under","at"]],
["The pool is ___ the bottom left-hand corner.",["in","on","at","by"]],
["The car park is ___ the left of the gym.",["on","in","at","to"]],
["Which sentence is correct?",["The pond was dug last year.","The pond was dig last year.","The pond dug last year.","The pond is dug last year."]],
["Which sentence compares two maps?",["The new library is bigger than the old one.","The new library big.","The library is.","Library new old."]],
["Which sentence is an overview?",["Overall, the centre became larger.","The café has 20 tables.","A tree was planted by the door.","The toilet is green."]],
["A map report should have at least ___ words.",["150","50","100","300"]],
["You should spend about ___ minutes on a map report.",["20","5","40","60"]]];
const RULE=["Use north, south, east and west and words like corner and middle to say exactly where a place is.","Use the past simple for finished actions. Regular verbs add -ed. Irregular verbs change (build → built).","The passive is was / were + past participle. Use it when the action is more important than who did it.","Linking words show addition (In addition), contrast (However, whereas) and overview (Overall).","A good map report has an introduction, an overview, details and a final check. Aim for 150+ words in about 20 minutes."];
const ST0=[0,10,22,32,42,50],NAMES=SEC.map(s=>s[0]).concat(["Review round"]);
const CFG={resetAt:2,fsRequired:true}; // 2 = warn on 1st departure, reset on 2nd
const $=id=>document.getElementById(id),g=$("g");
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};
let S,M={},stg=[],LOG=[],REC=[],AN=0,RES=0,DT=0,T0=null,DONE=null,AT=false,REL=false,ST=0,AW=false,TA=0,FST=0,SHOT=false,LN=false,PK=0;
const lg=(type,detail)=>{if(LOG.length<400)LOG.push({t:new Date().toISOString(),type,detail:detail||""})};
function newAttempt(){AN++;LOG=[];REC=[];RES=0;DT=0;T0=new Date();DONE=null;lg("attempt-start","attempt "+AN)}
function intro(){AT=false;REL=false;gate();S={name:"",yg:"",fg:"",score:0,streak:0,st:0,q:[],i:0,sok:0,sn:0,ok:0,n:0};M={};stg=[];
g.innerHTML=`<div class="box"><b>Activity goal</b><br>Describe where places are on a map and how a place changed over time, using the correct grammar and linking words.</div>
<div class="box"><b>Learning objectives</b> By the end I can:<ul><li>say where places are using directions and prepositions,</li><li>use the past simple and the passive to describe change,</li><li>link ideas with words like <i>however</i> and <i>overall</i>,</li><li>choose the best words to write a clear map report.</li></ul></div>
<div class="box"><b>Success criteria</b> 80% or more in each mission. Clues you miss come back for a second chance.</div>
<label for="nm"><b>English Name</b></label><input id="nm" autocomplete="off"><label for="yg"><b>Year Group</b></label><input id="yg" autocomplete="off" placeholder="e.g. Year 10"><label for="fg"><b>Form Group</b></label><input id="fg" autocomplete="off" placeholder="e.g. 10B">
<div class="fb" id="er" role="alert" style="color:var(--bad)"></div><button class="btn o" id="go" style="width:100%;font-size:16px;padding:13px">Start the mission</button>`;
$("go").onclick=()=>{const n=$("nm").value.trim(),y=$("yg").value.trim(),f=$("fg").value.trim();if(!n||!y||!f){$("er").textContent="Please fill in your English Name, Year Group and Form Group.";return}
S.name=n;S.yg=y;S.fg=f;AT=true;ST=0;AW=false;newAttempt();lg("fullscreen-status",isFull()?"active at start":"not active");guide()}}
function guide(){lg("guided-example","shown");
g.innerHTML=`<div class="sr"><span>Guided example</span><span>not scored</span></div><p class="q">Look first. Then practise.</p>
<div class="box"><b>Read the map</b><div class="map">${MAP.map(m=>`<div><span>${m[0]}</span>${m[1]}</div>`).join("")}</div><p class="note">North is at the top.</p><p>The <b>café</b> is in the top right-hand <b>corner</b>. The <b>garden</b> is <b>between</b> the gym and the bank.</p></div>
<div class="box"><b>Past simple and passive</b><p>Active: They <b>built</b> a gym. → Passive: A gym <b>was built</b>.</p><p><b>However</b> shows contrast. <b>Overall</b> starts a summary.</p></div>
<div class="row"><button class="btn s" id="sp">🔊 Hear it</button><button class="btn o" id="gx">I am ready</button></div>`;
$("sp").onclick=()=>say("The café is in the top right-hand corner. A gym was built.");$("gx").onclick=()=>begin(0)}
function mk(id,x){return{id,opts:sh(Q[id][1]),...x}}
function begin(n){S.st=n;S.i=0;S.sok=0;S.sn=0;S.q=sh([...Array(ST0[n+1]-ST0[n]).keys()].map(k=>ST0[n]+k)).map(id=>mk(id,{}));
lg("stage-start",NAMES[n]+" | order: "+S.q.map(q=>q.id+1).join(", "));show()}
function head(){return`<div class="dots">${[0,1,2,3,4].map(i=>`<span class="${i<S.st?"c":i==S.st?"d":""}"></span>`).join("")}</div><div class="sr"><span>${NAMES[S.st]} · ${Math.min(S.i+1,S.q.length)}/${S.q.length}</span><span>⭐ ${S.score} · 🔥 ${S.streak}</span></div><div class="pg"><i style="width:${S.i/S.q.length*100}%"></i></div>`}
function show(){if(S.i>=S.q.length)return endStage();const it=S.q[S.i],p=Q[it.id];
const map=it.id<10?`<div class="map">${MAP.map(m=>`<div><span>${m[0]}</span>${m[1]}</div>`).join("")}</div><p class="note">North is at the top of the map.</p>`:"";
g.innerHTML=head()+map+`<p class="q">${esc(p[0])}</p><div class="opts" id="o" role="group" aria-label="Answer choices"></div><div class="row"><button class="btn s" id="sp">🔊 Hear it</button><button class="btn" id="nx" style="display:none">Next →</button></div><div class="fb" id="fb" aria-live="polite"></div>`;
it.opts.forEach(x=>{const b=document.createElement("button");b.className="opt";b.textContent=x;b.onclick=()=>pick(it,x,b);$("o").appendChild(b)});
$("sp").onclick=()=>say(p[0].replace("___","blank"));$("nx").onclick=()=>{S.i++;show()}}
function pick(it,x,b){if(b.disabled)return;const p=Q[it.id],r=p[1][0],ok=x==r;
document.querySelectorAll(".opt").forEach(e=>{e.disabled=1});ok?b.classList.add("c"):b.classList.add("w");
const st=it.rv?6:S.st;REC.push({id:it.id,stage:st+1,q:p[0],shown:it.opts.slice(),chosen:x,correct:r,ok,retry:!!it.r,rv:!!it.rv});
if(!it.rv){const m=M[it.id]=M[it.id]||{ok:0,bad:0};ok?m.ok++:m.bad++}
if(ok){S.streak++;S.score+=10+(S.streak>=3?5:0)}else{S.streak=0;if(!it.r&&!it.rv)S.q.push(mk(it.id,{r:1}))}
if(!it.r&&!it.rv){S.sn++;S.n++;if(ok){S.sok++;S.ok++}}
const sec=Math.max(0,SEC.map(s=>s[1]).filter(s=>it.id>=s).length-1);
$("fb").innerHTML=`<b class="${ok?"g":"r"}">${ok?"Correct! "+(S.streak>=3?"🔥 ":""):"Not yet. "}</b>${RULE[sec]}`;$("nx").style.display="inline-block";$("nx").focus();if(ok)say(r)}
function endStage(){if(S.st==5)return finish();const a=S.sn?Math.round(100*S.sok/S.sn):100,s=a>=90?3:a>=70?2:1;if(S.st<5)stg[S.st]=a;
g.innerHTML=`<div class="big">${"⭐".repeat(s)}</div><h2 style="text-align:center;margin:6px 0">${NAMES[S.st]} complete!</h2><p style="text-align:center;color:var(--mut)">First-try accuracy: <b>${a}%</b> · Missed clues come back in the review round.</p><button class="btn o" id="n" style="width:100%">${S.st==4?"Review round":"Next mission"} →</button>`;
$("n").onclick=()=>S.st==4?review():begin(S.st+1)}
function review(){const ids=[...new Set(REC.filter(r=>!r.ok&&!r.retry&&!r.rv).map(r=>r.id))];if(!ids.length)return finish();
S.st=5;S.i=0;S.sok=0;S.sn=0;S.q=sh(ids).slice(0,8).map(id=>mk(id,{rv:1}));lg("stage-start","Review round | order: "+S.q.map(q=>q.id+1).join(", "));show()}
function finish(){AT=false;REL=true;gate();DONE=new Date();lg("completed","score "+S.score);const acc=S.n?Math.round(100*S.ok/S.n):0,miss=[...new Set(REC.filter(r=>!r.ok&&!r.retry&&!r.rv).map(r=>r.id+1))];
const chk=SEC.map((s,i)=>(stg[i]>=80?"✅ ":"🔁 ")+s[0]+" (80%+)").join("<br>"),mR=myWork(acc,miss),tR=report(acc,miss),mine=wrap(mR),sum=wrap(tR),rvw=REC.map((r,k)=>`<div class="box"><b>${k+1}.</b> ${esc(r.q)}<br>My answer: <b>${esc(r.chosen)}</b> ${r.ok?"✅":"❌ Correct answer: <b>"+esc(r.correct)+"</b>"}${r.rv?" (review)":r.retry?" (second try)":""}</div>`).join("");
g.innerHTML=`<div class="big">${acc>=90?"🏆":acc>=75?"🌟":"💪"}</div><h2 style="text-align:center;margin:6px 0">${esc(S.name)}, case closed!</h2><div class="stat"><div><b>${S.score}</b>Score</div><div><b>${acc}%</b>First-try</div><div><b>${miss.length}</b>To review</div></div>
<p><b>Did I reach my goals?</b></p><div class="box">${chk}</div><div class="chips">${SEC.map((s,i)=>`<span class="chip ${stg[i]>=80?"g":"b"}">${s[0]} ${stg[i]}%</span>`).join("")}</div>
<details open><summary><b>Final review</b> (all questions and my answers)</summary>${rvw}</details><div class="row"><button class="btn" id="pd">Save my work as PDF</button><button class="btn" id="cw">Copy My Work</button><button class="btn s" id="pr">Print</button><button class="btn s" id="ag">Play again</button></div><p class="fb" id="ct" aria-live="polite"></p>
<details><summary><b>Teacher report</b> (tap to read)</summary><pre data-allow id="rp"></pre><div class="row"><button class="btn s" id="cp">Copy teacher report</button><button class="btn s" id="pt">Save teacher report as PDF</button></div></details>`;
$("rp").textContent=sum;$("ag").onclick=intro;$("pd").onclick=()=>savePdf(mR,"my_work");$("pt").onclick=()=>savePdf(tR,"teacher_report");$("cw").onclick=()=>cpy(mine);$("cp").onclick=()=>cpy(sum);$("pr").onclick=()=>prt(mine)}
const wrap=(t,w=100)=>t.split("\n").flatMap(p=>{const o=[];let l="";p.split(" ").forEach(x=>{if((l+x).length>w&&l){o.push(l.trimEnd());l="   "}l+=x+" "});o.push(l.trimEnd());return o}).join("\n");
function report(acc,miss){const f=REC.filter(r=>!r.retry&&!r.rv),L=[],P=s=>L.push(s);
P("MAP DETECTIVE - TEACHER REPORT");P("English Name: "+S.name+" | Year Group: "+S.yg+" | Form Group: "+S.fg);P("Attempt number: "+AN+" | Status: "+(DONE?"Completed":"Not completed"));
P("Started: "+(T0?T0.toISOString():"n/a")+" | Completed: "+(DONE?DONE.toISOString():"n/a"));P("Score: "+S.score+" | First-try correct: "+f.filter(r=>r.ok).length+"/"+f.length+" ("+acc+"%) | Unanswered: "+Math.max(0,50-f.length));
P("Departures detected: "+DT+" | Warnings shown: "+LOG.filter(x=>x.type=="warning-shown").length+" | Resets: "+RES);P("");P("CLUES MISSED ON FIRST TRY: "+(miss.join(", ")||"none"));
P("");P("QUESTIONS IN THE ORDER PRESENTED");REC.forEach((r,i)=>P((i+1)+". S"+r.stage+" clue "+(r.id+1)+(r.rv?" (review)":r.retry?" (retry)":"")+" | "+r.q+" | shown: "+r.shown.join(" / ")+" | student: "+r.chosen+" | correct: "+r.correct+" | "+(r.ok?"CORRECT":"INCORRECT")));
P("");P("INTEGRITY EVENTS (browser-visible only)");LOG.forEach(x=>P(x.t+" | "+x.type+(x.detail?" | "+x.detail:"")));
P("");P("NOTES: Events are limited to what the browser reports: page hidden or focus lost, full-screen changes, blocked copy and paste, and screenshot-related key presses (most screenshot methods cannot be detected). The page cannot see other apps, other devices, or AI and translation tools. A recorded event is not proof of misconduct. Records stay on this device and are not sent anywhere automatically.");return L.join("\n")}
function myWork(acc,miss){const f=REC.filter(r=>!r.retry&&!r.rv),L=[],P=s=>L.push(s);
P("MAP DETECTIVE - MY WORK");P("English Name: "+S.name+" | Year Group: "+S.yg+" | Form Group: "+S.fg);P("Completed: "+(DONE?DONE.toISOString().slice(0,16).replace("T"," ")+" UTC":"not completed")+" | Attempt: "+AN);
P("Score: "+S.score+" | First-try correct: "+f.filter(r=>r.ok).length+"/"+f.length+" ("+acc+"%)");P("");P("MY ANSWERS");
REC.forEach((r,i)=>P((i+1)+". "+NAMES[r.stage-1]+" | "+r.q+" | My answer: "+r.chosen+" | "+(r.ok?"Correct":"Not yet. Correct answer: "+r.correct)+(r.rv?" (review)":r.retry?" (second try)":"")));
P("");P("CLUES TO PRACTISE AGAIN: "+(miss.join(", ")||"none"));return L.join("\n")}

function mkPdf(text,foot){const PW=595,PH=842,MG=48,LH=12.5,CPL=88,L=[];
wrap(text,CPL).split("\n").forEach(l=>{while(l.length>CPL){L.push(l.slice(0,CPL));l="   "+l.slice(CPL)}L.push(l)});

const e=s=>String(s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/[^\x20-\x7E]/g,"?").replace(/([\\()])/g,"\\$1");
const o=[];o[1]="<</Type/Catalog/Pages 2 0 R>>";o[3]="<</Type/Font/Subtype/Type1/BaseFont/Courier>>";o[4]="<</Type/Font/Subtype/Type1/BaseFont/Courier-Bold>>";let n=5;const kids=[];
pages.forEach((p,pi)=>{let c="";p.forEach((l,i)=>{const b=/^[A-Z][A-Z0-9 ,.&'\-:()]{5,}$/.test(l);c+=`BT /${b?"F2":"F1"} 9 Tf ${MG} ${(PH-MG-i*LH).toFixed(1)} Td (${e(l)}) Tj ET\n`});
c+=`BT /F1 8 Tf ${MG} 28 Td (${e(foot+"  |  Page "+(pi+1)+" of "+pages.length)}) Tj ET`;
o[n]="<</Length "+c.length+">>\nstream\n"+c+"\nendstream";o[n+1]="<</Type/Page/Parent 2 0 R/MediaBox[0 0 "+PW+" "+PH+"]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents "+n+" 0 R>>";kids.push(n+1);n+=2});
o[2]="<</Type/Pages/Count "+kids.length+"/Kids["+kids.map(k=>k+" 0 R").join(" ")+"]>>";
let s="%PDF-1.4\n";const off=[];for(let i=1;i<o.length;i++){off[i]=s.length;s+=i+" 0 obj\n"+o[i]+"\nendobj\n"}
const x=s.length;s+="xref\n0 "+o.length+"\n0000000000 65535 f \n"+off.slice(1).map(v=>String(v).padStart(10,"0")+" 00000 n \n").join("")+"trailer\n<</Size "+o.length+"/Root 1 0 R>>\nstartxref\n"+x+"\n%%EOF";
return new Blob([Uint8Array.from(s,c=>c.charCodeAt(0)&255)],{type:"application/pdf"})}
async function savePdf(txt,tag){const t=$("ct");try{let d=null;try{d=window.claude?await window.claude.use("downloads"):null}catch(x){d=null}const fn="Map_Detective_"+S.name.replace(/[^A-Za-z0-9]+/g,"_")+"_attempt"+AN+"_"+tag+".pdf",bl=mkPdf(txt,"Map Detective - "+S.name+" ("+S.yg+", "+S.fg+")");
if(!d){const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);t.textContent="PDF ready. Check your downloads.";return}
await d.save({filename:fn,data:bl});t.textContent="PDF ready. Check your downloads."}catch(e){t.textContent=(e&&e.code=="declined")?"Save cancelled.":"Could not save the PDF. Use Copy My Work instead."}}
/* ---- full screen silent freeze ---- */
const FSE=()=>document.fullscreenElement||document.webkitFullscreenElement;
const sizeOk=()=>{const lw=innerWidth>=innerHeight,m=Math.max(screen.width,screen.height),n=Math.min(screen.width,screen.height),SW=lw?m:n,SH=lw?n:m,a=document.activeElement,ty=a&&/^(INPUT|TEXTAREA)$/.test(a.tagName);
let ok=innerWidth>=SW*.95&&(ty||innerHeight>=SH*.75);const pm=Math.max(innerWidth,innerHeight)*(devicePixelRatio||1);if(ok&&pm>PK)PK=pm;return ok&&(ty||pm>=PK*.9)};
const isFull=()=>!!FSE()||sizeOk(),need=()=>SHOT||(CFG.fsRequired&&!REL&&!isFull());
function gate(){const o=$("fs"),wp=document.querySelector(".wrap");LN=need();if(!LN){o.style.display="none";wp.inert=false;wp.removeAttribute("aria-hidden");return}wp.inert=true;wp.setAttribute("aria-hidden","true");o.style.display="block"}
$("fs").onclick=()=>{if(SHOT){SHOT=false;gate()}if(!need())return;const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(f){try{Promise.resolve(f.call(e)).catch(()=>{})}catch(x){}}};
const check=()=>{const n=need();if(n!==LN){if(AT)lg(n?"fullscreen-exit":"fullscreen-enter",n?"activity paused":"activity resumed");gate()}};
const onfs=()=>{FST=Date.now();check()};document.addEventListener("fullscreenchange",onfs);document.addEventListener("webkitfullscreenchange",onfs);
window.addEventListener("resize",check);document.addEventListener("focusin",check);document.addEventListener("focusout",()=>setTimeout(check,50));setInterval(check,400);window.addEventListener("orientationchange",()=>setTimeout(check,150));

const scKey=e=>{const c=e.code||"",k=e.key||"";if(c=="PrintScreen"||k=="PrintScreen"||k=="Snapshot")return"PrintScreen";if(e.metaKey&&e.shiftKey&&/^(Digit|Numpad)[3-6]$/.test(c))return"Cmd+Shift+"+c.slice(-1);if(e.metaKey&&e.shiftKey&&c=="KeyS")return"Win/Cmd+Shift+S";return""};
["keydown","keyup"].forEach(t=>document.addEventListener(t,e=>{const k=scKey(e);if(k)shot(k)},true));

const allow=e=>e.target&&e.target.closest&&e.target.closest("[data-allow]");
["copy","cut","paste","drop","contextmenu","dragstart"].forEach(t=>document.addEventListener(t,e=>{if(t=="copy"&&allow(e))return;if(AT)lg("blocked-"+t,"");e.preventDefault()}));
