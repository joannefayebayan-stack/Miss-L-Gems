<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#14261c;--mute:#5b6e63;--line:#cfdcd3;--brand:#0f7a4f;--brand2:#e8f5ee;--hot:#e4572e;--ok:#1b9a5a;--bad:#d1383d;--gold:#f2b600;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 "Sarabun",system-ui,"Noto Sans Thai","Leelawadee UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:2rem;line-height:1.1;margin:.2em 0 .3em;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;margin:0 0 .5em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.stat{display:flex;gap:14px;font-weight:600;font-size:.95rem}
.sub{color:var(--mute);margin:0 0 18px}
.th{color:var(--mute);font-size:.92em}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.menu button{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;color:var(--ink);font:inherit;cursor:pointer}
.menu button:hover,.menu button:focus-visible{border-color:var(--brand)}
.menu b{font-size:1.1rem;display:block}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:800}


.ghost{background:none;border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 14px}
.term{font-size:2.1rem;font-weight:800;margin:.1em 0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--brand2)}
.opt.bad{border-color:var(--bad)}
.fb{padding:12px 14px;border-radius:12px;background:var(--brand2);margin:6px 0 12px}
.flash{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;padding:20px}
.big{font-size:3rem;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;background:var(--brand2);border-radius:20px;padding:2px 12px;font-size:.85rem;font-weight:600}
</style>

.btn,.btn.o,button.btn,.next,.go,.start,.play,.vid{background:#C9D8F5!important;color:#24406E!important;box-shadow:0 3px 0 #AEC3EC}
.btn:hover,.next:hover,.go:hover,.start:hover,.play:hover,.vid:hover{background:#AEC3EC!important}
.btn.s{background:#fff!important;color:#24406E!important;border-color:#8FAEE3;box-shadow:0 3px 0 #DCE5F5}
.sec,.pick,.ghost,button.alt{background:#fff;color:#24406E;border-color:#8FAEE3}
.sel{background:#C9D8F5!important;border-color:#AEC3EC!important;color:#24406E!important}
.seg-b.on{background:#C9D8F5;border-color:#AEC3EC;color:#24406E}
.sbr .rk,.ho.ok b{background:#C9D8F5;color:#24406E}
.fb,.toast{color:inherit}.toast{color:#1F6B45}
.pg i,.bar i,.fill{background:#8FAEE3!important}
.pod .p1{background:#C9D8F5}
:focus-visible{outline:3px solid #24406E;outline-offset:2px}
h1,h2,.box b,.fbk b,.stat b,.ltr,.eyebrow,.eye,.task h4,.end h2{color:#24406E}
</style>
