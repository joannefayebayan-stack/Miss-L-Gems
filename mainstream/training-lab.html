<html lang="en">
<head>

<title>Training Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#14261c;--mute:#5b6e63;--line:#cfdcd3;--brand:#0f7a4f;--brand2:#e8f5ee;--hot:#e4572e;--ok:#1b9a5a;--bad:#d1383d;--gold:#f2b600;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#182720;--ink:#eaf4ee;--mute:#9bb2a5;--line:#2c4337;--brand:#4cd08f;--brand2:#1d3a2c;--hot:#ff8a63;--ok:#4cd08f;--bad:#ff7075;--gold:#ffd23f}}
:root[data-theme="dark"]{--bg:#0f1a14;--card:#182720;--ink:#eaf4ee;--mute:#9bb2a5;--line:#2c4337;--brand:#4cd08f;--brand2:#1d3a2c;--hot:#ff8a63;--ok:#4cd08f;--bad:#ff7075;--gold:#ffd23f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 "Sarabun",system-ui,"Noto Sans Thai","Leelawadee UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:2rem;line-height:1.1;margin:.2em 0 .3em;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;margin:0 0 .5em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.stat{display:flex;gap:14px;font-weight:600;font-size:.95rem}
.sub{color:var(--mute);margin:0 0 18px}
.th{color:var(--mute);font-size:.92em}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.menu button{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;color:var(--ink);font:inherit;cursor:pointer}
.menu button:hover,.menu button:focus-visible{border-color:var(--brand)}
.menu b{font-size:1.1rem;display:block}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:800}
:root[data-theme="dark"] .btn{color:#0f1a14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0f1a14}}
.ghost{background:none;border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 14px}
.term{font-size:2.1rem;font-weight:800;margin:.1em 0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--brand2)}
.opt.bad{border-color:var(--bad)}
.fb{padding:12px 14px;border-radius:12px;background:var(--brand2);margin:6px 0 12px}
.flash{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;padding:20px}
.big{font-size:3rem;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;background:var(--brand2);border-radius:20px;padding:2px 12px;font-size:.85rem;font-weight:600}
</style>
</head>

function start(mode){G={mode:mode,i:0,score:0,streak:0,items:[]};}
function match(){start("m");G.items=sh(fw()).slice(0,nn());redraw=mq;mq()}
function mq(){var w=G.items[G.i],d=sh(W.filter(function(x){return x!==w})).slice(0,3).map(function(x){return x[2]}),o=sh(d.concat([w[2]]));
G.ans=w[2];ask('What does this mean?','<p class="term">'+w[0]+'</p>'+th(w[1]),o,function(o){return o},w[3]?'Example: '+w[3]:'')}
function quiz(){start("q");G.items=sh(fq()).slice(0,nn());redraw=qq;qq()}
function qq(){var q=G.items[G.i],o=q[1].map(function(t,i){return{t:t,c:i===q[2]}});o=sh(o);G.ans=q[1][q[2]];
ask('Read and choose',"<p><b>"+q[0]+"</b></p>",o.map(function(x){return x.t}),null,q[3]+(S.thai&&q[4]?' · '+q[4]:''))}
function gap(){start("g");G.items=sh(fw()).slice(0,nn());redraw=gq;gq()}
function gq(){var w=G.items[G.i],d=sh(W.filter(function(x){return x!==w})).slice(0,3).map(function(x){return x[0]}),o=sh(d.concat([w[0]]));
G.ans=w[0];ask('Which word fits the gap?','<p><b>_____ = '+w[2]+'</b></p><p class="th">Example: '+w[3]+'</p>',o,null,w[0]+' = '+w[1])}
function ask(label,body,opts,f,fb){var n=G.items.length,h='';
opts.forEach(function(t,i){h+='<button class="opt" data-i="'+i+'">'+t+'</button>'});
app.innerHTML=topbar(true)+'<div class="bar"><i style="width:'+(G.i/n*100)+'%"></i></div><div class="card"><div class="th">'+label+' · '+(G.i+1)+'/'+n+(G.streak>1?' · 🔥 '+G.streak:'')+'</div>'+body+'</div>'+h+'<div id="fb"></div>';
var bs=app.querySelectorAll(".opt");
bs.forEach(function(b){b.onclick=function(){var right=opts[+b.dataset.i]===G.ans;rec(right);
bs.forEach(function(x){x.disabled=true;if(opts[+x.dataset.i]===G.ans)x.classList.add("ok")});
if(right){G.score++;G.streak++;S.xp+=10+Math.min(G.streak,5)}else{b.classList.add("bad");G.streak=0}
document.getElementById("fb").innerHTML='<div class="fb">'+(right?'✅ Correct! ':'❌ Not quite. ')+(fb||'')+'</div><button class="btn" id="nx">'+(G.i<n-1?'Next':'See result')+'</button>';
document.getElementById("nx").onclick=function(){G.i++;if(G.i<n){({m:mq,q:qq,g:gq,p:pq,t:tq,e:eq,r:rq,h:hq})[G.mode]()}else done()}}})}
function done(){var n=G.items.length,p=G.score/n,st=p>=.9?'🌟🌟🌟':p>=.6?'🌟🌟':'🌟';
if(S.unit&&G.score>S.ub[S.unit])S.ub[S.unit]=G.score;if(G.score>S.best){S.best=G.score;try{localStorage.setItem("trainingLabBest",S.best)}catch(e){}}
redraw=modes;app.innerHTML=topbar(true)+'<div class="card" style="text-align:center"><p class="big">'+st+'</p><h2>'+G.score+' / '+n+'</h2><p>'+(p>=.9?'Excellent! Ready for the exam.':p>=.6?'Good work! Try again to get 3 stars.':'Keep going! Use the flashcards, then try again.')+'</p>'+
(S.thai?'<p class="th">'+(p>=.9?'เยี่ยมมาก อชิ!':p>=.6?'ดีมาก ลองอีกครั้งเพื่อให้ได้ 3 ดาว':'สู้ๆ ลองทบทวนบัตรคำแล้วเล่นใหม่')+'</p>':'')+
'<div class="row" style="justify-content:center"><button class="btn" onclick="'+({m:'match',q:'quiz',g:'gap',p:'pros',t:'tf',e:'thai',r:'prin',h:'phase'})[G.mode]+'()">Play again</button><button class="ghost" onclick="modes()">Menu</button><button class="ghost" onclick="report()">📊 Progress</button></div></div>'}
home();
</script>
